id: hard-telemetry-noise-hides-scheduling-112
seed: 1112
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: configmap_edit
    name: otel-collector-agent
    key: relay
    replace:
    - - 'endpoint: jaeger:4317'
      - 'endpoint: jaeger:4999'
    restart_after:
    - daemonset/otel-collector-agent
    pause_s: 30
  - type: object_patch
    kind: node
    name: ai-gym-worker
    namespace: null
    ops:
    - op: append
      path: /spec/taints
      value:
        key: dedicated
        value: batch
        effect: NoSchedule
  - type: object_patch
    kind: node
    name: ai-gym-worker2
    namespace: null
    ops:
    - op: append
      path: /spec/taints
      value:
        key: dedicated
        value: batch
        effect: NoSchedule
    recreate_pods_after:
    - opentelemetry.io/name=currency
task:
  mode: diagnose_and_mitigate
  prompt: International customers report that prices fail to load in their currency. At the same time, traces stopped
    arriving in Jaeger and the collector logs are full of export errors. Find what is breaking customers and fix
    it.
tools:
- kubectl
- curl
verifier:
  outcome:
  - journey:currency
  - pods_ready:opentelemetry.io/name=currency
  root_cause:
  - loud-telemetry-outage-masks-scheduling-fault
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
