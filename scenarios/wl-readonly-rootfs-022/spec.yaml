    what: readOnlyRootFilesystem is set, but nginx must write under /run and /var/cache/nginx, so it exits at startup
  explanation: image-provider (nginx) was given a read-only root filesystem, but nginx must write its pid file and
    cache under `/run` and `/var/cache/nginx`. It exits at startup.
