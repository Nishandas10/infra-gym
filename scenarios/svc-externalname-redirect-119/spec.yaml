notes:
- 'Measured on a dev cluster, 2026-10-17: without restarting the callers, cart and checkout kept passing for 4 min
  after the change (established gRPC connections), and the EndpointSlice kept its endpoint, so `endpoints` cannot
  see the fault. With frontend and checkout restarted: cart and checkout journeys FAIL (500/503) on every poll for
  5 min. After the patch back to ClusterIP, cart PASSed within 30 s and checkout within 90 s with no restart; PASS
  for the remaining 5 min.'
