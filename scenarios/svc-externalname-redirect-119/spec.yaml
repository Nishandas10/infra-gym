ground_truth:
  root_causes:
  - component: service/cart
    namespace: default
    what: its type was changed to ExternalName pointing at cart.cart-v2.svc.cluster.local, a name that does not
      exist, so new connections to cart cannot be resolved
  explanation: 'An unfinished migration converted the cart Service to `type: ExternalName` with `externalName: cart.cart-v2.svc.cluster.local`;
    the namespace cart-v2 does not exist. The change dropped the Service''s cluster IP, and the cluster DNS now
    answers `cart` with a CNAME to a name that does not resolve. Frontend and checkout kept working on their existing
    gRPC connections until they were redeployed; every new connection fails, so adding to the cart and checkout
    fail while the cart pod itself is healthy. The deploys are not the cause.'
  evidence:
  - '`kubectl logs deploy/frontend`: errors calling the cart service (name resolution / UNAVAILABLE).'
  - '`kubectl get svc cart`: TYPE `ExternalName`, EXTERNAL-IP `cart.cart-v2.svc.cluster.local`, no cluster IP; every
    other shop Service is `ClusterIP`.'
  - '`kubectl get ns cart-v2`: NotFound.'
  - '`kubectl get pods -l opentelemetry.io/name=cart`: Running and Ready; its EndpointSlice still lists the pod.'
  red_herrings:
  - The frontend and checkout deploys look like the trigger; rolling them back or restarting them changes nothing.
reference:
  commands:
  - kubectl patch service cart --type merge -p '{"spec":{"type":"ClusterIP","externalName":null}}'
  fix: 'Change the cart Service back to `type: ClusterIP` and drop `externalName` (Kubernetes assigns a new cluster
    IP; clients use the name, so that is fine). Deleting the Service and recreating it as ClusterIP with the same
    selector and port also works. Rolling back or restarting frontend and checkout does not.'
