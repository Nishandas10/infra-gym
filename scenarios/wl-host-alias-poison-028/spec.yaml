id: wl-host-alias-poison-028
seed: 1028
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: frontend
  recreate_pods: false
  ops:
  - op: set
    path: /spec/template/spec/hostAliases
    value:
    - ip: 192.0.2.10
      hostnames:
      - product-catalog
task:
  mode: diagnose_and_mitigate
  prompt: Product listings and product pages time out, but checkout (which also uses the catalog) works. Find the
    cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:browse
  - journey:catalog
  root_cause:
  - frontend
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl patch deployment frontend --type=json -p '[{"op":"remove","path":"/spec/template/spec/hostAliases"}]'
  - kubectl rollout status deployment/frontend --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/hostaliases-override
  title: hostAliases entry sends a dependency to a dead IP
  generated: true
  est_pass_rate: null
  split: train
