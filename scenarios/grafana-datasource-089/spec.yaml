ground_truth:
  root_causes:
  - component: configmap/grafana-datasources
    namespace: default
    what: the provisioned Prometheus datasource URL points at port 9099, where nothing listens
  explanation: The provisioned Prometheus datasource URL was changed to port 9099, where nothing listens, so Grafana's
    queries time out while Prometheus and the data are fine. The datasource sidecar applies ConfigMap edits to Grafana
    live, so fixing the ConfigMap is enough; no restart is needed.
  evidence:
  - 'Grafana > Connections > Data sources > Prometheus > Test: the query to :9099 times out.'
  - '`kubectl get cm grafana-datasources -o yaml`: the URL.'
  - '`kubectl logs deploy/grafana -c grafana-sc-datasources`: it wrote the new file and Grafana reloaded it.'
  - Prometheus answers on :9090 directly.
reference:
  commands:
  - kubectl get configmap grafana-datasources -o yaml | sed 's|prometheus:9099|prometheus:9090|' | kubectl replace
    -f -
validation:
  detect_timeout_s: 300
