notes:
- 'No restarts: the grafana-sc-datasources sidecar watches ConfigMaps labelled grafana_datasource and calls Grafana''s
  provisioning reload API, so edits apply live (~15s).'
- An earlier version restarted Grafana on inject and fix. The verifier then failed only because Grafana itself was
  down, and each rolling restart briefly ran two 4-container Grafana pods, which thrashed the 6 GB VM late in long
  batches.
