ground_truth:
  root_causes:
  - component: deployment/prometheus
    namespace: default
    what: automountServiceAccountToken is false, so Prometheus has no token or CA certificate for the Kubernetes
      API and its Kubernetes service discovery and cadvisor scrape pools cannot be created
  explanation: 'A pod hardening change set `automountServiceAccountToken: false` on several Deployments, Prometheus
    among them. Prometheus discovers its kubernetes-pods targets and scrapes the nodes'' cadvisor through the Kubernetes
    API with the pod''s service account token and CA certificate. Without the mounted token those scrape pools fail
    ("unable to read CA cert"), so every container and pod-annotation metric disappears. Application metrics still
    arrive because the collector pushes them over OTLP. Prometheus itself stays Running and Ready.'
  evidence:
  - '`kubectl logs deploy/prometheus`: `error creating new scrape pool ... unable to read CA cert` for the kubernetes-*
    jobs.'
  - Prometheus `up{job="kubernetes-nodes-cadvisor"}` and `up{job="kubernetes-pods"}` return nothing; OTLP application
    metrics are still current.
  - '`kubectl get deploy prometheus -o yaml`: `automountServiceAccountToken: false` in the pod template; the pod
    has no /var/run/secrets/kubernetes.io/serviceaccount volume.'
  red_herrings:
  - 'quote and currency got the same `automountServiceAccountToken: false`; they never call the Kubernetes API and
    are unaffected.'
reference:
  commands:
  - kubectl patch deployment prometheus --type json -p '[{"op":"remove","path":"/spec/template/spec/automountServiceAccountToken"}]'
  - kubectl rollout status deployment/prometheus --timeout=240s
  fix: 'Remove `automountServiceAccountToken: false` from the Prometheus Deployment''s pod template (or set it to
    true); the rollout gives the new pod its token and the Kubernetes scrape jobs come back within about a minute.
    quote and currency do not need to change.'
