id: wl-bad-command-012
seed: 1012
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: quote
  strategy: Recreate
  ops:
  - op: set
    path: /spec/template/spec/containers/$c/command
    value:
    - /usr/local/bin/quote-server
task:
  mode: diagnose_and_mitigate
  prompt: Every order fails with a shipping error. The shipping service itself is Running. Find the cause and fix
    it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:checkout
  - pods_ready:opentelemetry.io/name=quote
  root_cause:
  - quote
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=quote
solution:
  commands:
  - kubectl patch deployment quote --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/command"}]'
  - kubectl rollout status deployment/quote --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/bad-entrypoint
  title: Container command points at a binary that does not exist
  generated: true
  est_pass_rate: null
  split: train
