ground_truth:
  root_causes:
  - component: serviceaccount/my-shop
    namespace: default
    what: was deleted; every shop pod runs as it, so the API server rejects any new shop pod
  explanation: The ServiceAccount `my-shop`, which every shop Deployment runs its pods as, was deleted. Pods that
    were already running keep running, but the API server rejects every new pod that names a ServiceAccount that
    does not exist. The cart pod was replaced afterwards, so its ReplicaSet keeps failing with `error looking up
    service account default/my-shop` and the cart has no pod at all; adding to cart and checkout fail.
  evidence:
  - '`kubectl get pods -l opentelemetry.io/name=cart`: no pod.'
  - '`kubectl describe rs -l opentelemetry.io/name=cart` / `kubectl get events`: FailedCreate, `pods "cart-..."
    is forbidden: error looking up service account default/my-shop: serviceaccount "my-shop" not found`.'
  - '`kubectl get serviceaccounts`: no `my-shop`; every shop Deployment has `serviceAccountName: my-shop`.'
reference:
  commands:
  - kubectl create serviceaccount my-shop
  - kubectl rollout restart deployment/cart
  - kubectl rollout status deployment/cart --timeout=300s
  fix: Recreate the ServiceAccount `my-shop`, then restart cart (`kubectl rollout restart deployment/cart`). The
    ReplicaSet retries the failed pod creation with an exponential backoff, which after a long outage reaches about
    16 minutes, so without the restart cart can stay down long after the ServiceAccount is back. Pointing the cart
    Deployment at another ServiceAccount (e.g. `default`) also brings cart back but leaves every other shop workload
    unable to restart.
validation:
  baseline_timeout_s: 120
  detect_timeout_s: 240
  hold_s: 60
  recover_timeout_s: 420
  poll_s: 10
  restart_settle_s: 45
notes:
- 'Measured on a dev cluster, 2026-10-17: cart had no pod and FailedCreate events for 4 min; after `kubectl create
  serviceaccount my-shop` the ReplicaSet (in backoff) created the pod within ~60 s and the cart journey passed at
  ~2 min. Revert recreates the ServiceAccount only if it is missing.'
- 'v2 (2026-10-17): the long-hold run (15 min outage) showed the ReplicaSet still in backoff 5 min after the ServiceAccount
