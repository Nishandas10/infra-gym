id: http-replace-059
seed: 1059
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: chaos_mesh
  manifest:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: HTTPChaos
    metadata:
      name: quote-http-garbage
      namespace: default
    spec:
      mode: all
      target: Response
      port: 8080
      path: '*'
      replace:
        body: bm90LWEtbnVtYmVy
        code: 200
      selector:
        namespaces:
        - default
        labelSelectors:
          opentelemetry.io/name: quote
task:
  mode: diagnose_and_mitigate
  prompt: Orders fail at the shipping step with parse errors, yet the quote service returns HTTP 200. Find the cause
    and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:checkout
  root_cause:
  - quote
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl delete httpchaos.chaos-mesh.org quote-http-garbage
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: chaos
  mechanism: chaos/http-response-corruption
  title: HTTP responses from a service replaced with garbage
  generated: true
  est_pass_rate: null
  split: train
