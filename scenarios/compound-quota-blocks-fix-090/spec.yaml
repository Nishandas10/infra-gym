id: compound-quota-blocks-fix-090
seed: 1090
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: workload_patch
    target: shipping
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:QUOTE_ADDR/value
      value: http://quote-svc:8080
    pause_s: 25
  - type: create_objects
    manifests:
    - apiVersion: v1
      kind: ResourceQuota
      metadata:
        name: namespace-pod-quota
        namespace: default
      spec:
        hard:
          pods: '10'
task:
  mode: diagnose_and_mitigate
  prompt: Orders fail at shipping. The obvious config fix was applied, but the rollout never completes. Find the
    cause and fix it for real.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:checkout
  root_cause:
  - shipping
  - resource-quota
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl delete resourcequota namespace-pod-quota
  - kubectl set env deployment/shipping QUOTE_ADDR=http://quote:8080
  - kubectl rollout status deployment/shipping --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: compound
  mechanism: compound/fix-blocked-by-quota
  title: Broken config plus a quota that blocks the rollout of the fix
  generated: true
  est_pass_rate: null
  split: train
