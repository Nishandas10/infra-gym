    what: a rewrite rule in the Corefile sends payment's name to the shipping Service
  explanation: Someone added `rewrite name payment.default.svc.cluster.local shipping.default.svc.cluster.local`
    to the CoreDNS Corefile. Lookups of `payment` return the shipping Service's IP, so checkout's gRPC calls reach
    an HTTP server and fail.
  evidence:
