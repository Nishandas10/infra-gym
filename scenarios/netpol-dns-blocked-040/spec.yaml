id: netpol-dns-blocked-040
seed: 1040
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: create_objects
  recreate_pods_after:
  - opentelemetry.io/name=frontend
  manifests:
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: frontend-egress-app-ports
      namespace: default
    spec:
      podSelector:
        matchLabels:
          opentelemetry.io/name: frontend
      policyTypes:
      - Egress
      egress:
      - ports:
        - protocol: TCP
          port: 8080
task:
  mode: diagnose_and_mitigate
  prompt: Every API call from the shop fails after a network-policy change, even though all backends are healthy
    and port 8080 is explicitly allowed. Find the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:browse
  - journey:cart
  root_cause:
  - frontend
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl delete networkpolicy frontend-egress-app-ports
  - kubectl rollout restart deployment/frontend
  - kubectl rollout status deployment/frontend --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: service-network
  mechanism: network-policy/dns-egress-blocked
  title: Egress policy allows app ports but blocks DNS
  generated: true
  est_pass_rate: null
  split: train
