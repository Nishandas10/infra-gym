ground_truth:
  root_causes:
  - component: configmap/flagd-config
    namespace: default
    what: paymentFailure has a targeting rule that serves the 90% variant (95% of charges fail) to every request
      since a time 10 minutes before the incident, while its defaultVariant stays off; the rule is both in the live
      flag file and in the flagd-config ConfigMap
  explanation: The paymentFailure flag still has `defaultVariant` off, which is what a quick look at the flag shows,
    but it gained a `targeting` rule (`$flagd.timestamp >= <a time 10 minutes before>`) that serves the 90% variant
    to every evaluation, so the payment service declines about 95% of charges. The rule is in flagd's live file
    and in the flagd-config ConfigMap that flagd loads at start, so restarting flagd brings it straight back.
  evidence:
  - 'payment logs: most charges fail with the feature-flag-driven error; a few succeed.'
  - flagd's OFREP API (POST /ofrep/v1/evaluate/flags/paymentFailure) returns variant 90% with reason TARGETING_MATCH,
