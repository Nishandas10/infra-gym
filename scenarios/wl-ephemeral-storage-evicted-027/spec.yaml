id: wl-ephemeral-storage-evicted-027
seed: 1027
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  kind: daemonset
  target: otel-collector-agent
  recreate_pods: false
  revert_hooks:
  - delete_failed_pods: true
  ops:
  - op: set
    path: /spec/template/spec/containers/$c/resources/limits/ephemeral-storage
    value: 64Ki
task:
  mode: diagnose_and_mitigate
  prompt: Traces keep disappearing from Jaeger for minutes at a time, and the telemetry collector pods keep being
    replaced. Find the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - pods_stable:app.kubernetes.io/name=opentelemetry-collector
  - jaeger_traces:frontend
  root_cause:
  - otel-collector
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: pods_stable
    selector: app.kubernetes.io/name=opentelemetry-collector
    min_age_s: 180
  - type: jaeger_traces
    service: frontend
    lookback: 1m
    min_traces: 1
solution:
  commands:
  - kubectl patch daemonset otel-collector-agent --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/resources/limits/ephemeral-storage"}]'
  - kubectl rollout status daemonset/otel-collector-agent --timeout=240s
  - kubectl delete pods --field-selector=status.phase=Failed
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/ephemeral-storage-eviction
  title: Tiny ephemeral-storage limit -> pods evicted over and over
  generated: true
  est_pass_rate: null
  split: train
