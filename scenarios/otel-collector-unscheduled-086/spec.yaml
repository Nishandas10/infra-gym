id: otel-collector-unscheduled-086
seed: 1086
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  kind: daemonset
  target: otel-collector-agent
  recreate_pods: false
  ops:
  - op: set
    path: /spec/template/spec/nodeSelector/telemetry-tier
    value: dedicated
task:
  mode: diagnose_and_mitigate
  prompt: 'All telemetry stopped at once: no new traces, and metrics have gone flat. Find the cause and fix it.'
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - pods_ready:app.kubernetes.io/name=opentelemetry-collector
  - jaeger_traces:frontend
  root_cause:
  - otel-collector
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: pods_ready
    selector: app.kubernetes.io/name=opentelemetry-collector
  - type: jaeger_traces
    service: frontend
    lookback: 1m
    min_traces: 1
solution:
  commands:
  - kubectl patch daemonset otel-collector-agent --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector/telemetry-tier"}]'
  - kubectl rollout status daemonset/otel-collector-agent --timeout=180s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: observability
  mechanism: observability/collector-not-running
  title: Collector DaemonSet has a nodeSelector that matches no node
  generated: true
  est_pass_rate: null
  split: train
