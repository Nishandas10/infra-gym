    what: the policy lets checkout reach nothing but DNS, so its init container never reaches Kafka
  explanation: An egress NetworkPolicy lets checkout pods reach only DNS. Checkout's init container waits for Kafka
    and can never connect, so the pod stays in `Init:0/1`. Even if it started, every dependency call would be blocked.
  evidence:
  - '`kubectl get pods`: checkout is `Init:0/1`.'
