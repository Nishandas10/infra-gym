id: wl-liveness-wrong-port-023
seed: 1023
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: product-catalog
  recreate_pods: false
  ops:
  - op: set
    path: /spec/template/spec/containers/$c/livenessProbe
    value:
      tcpSocket:
        port: 9999
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2
task:
  mode: diagnose_and_mitigate
  prompt: Product pages fail every few seconds, and the product-catalog pod's restart count keeps rising. Find the
    cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - pods_stable:opentelemetry.io/name=product-catalog
  - journey:browse
  - journey:catalog
  root_cause:
  - product-catalog
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: pods_stable
    selector: opentelemetry.io/name=product-catalog
    min_age_s: 120
  - type: journey
    journey: browse
    repeat: 4
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl patch deployment product-catalog --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/livenessProbe"}]'
  - kubectl rollout status deployment/product-catalog --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 360
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/liveness-probe-misconfigured
  title: Liveness probe checks the wrong port -> restart loop
  generated: true
  est_pass_rate: null
  split: train
