id: kube-proxy-stopped-051
seed: 1051
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: workload_patch
    kind: daemonset
    namespace: kube-system
    target: kube-proxy
    recreate_pods: false
    pause_s: 20
    ops:
    - op: set
      path: /spec/template/spec/nodeSelector/proxy-tier
      value: disabled
  - type: create_objects
    manifests: []
    recreate_pods_after:
    - opentelemetry.io/name=payment
task:
  mode: diagnose_and_mitigate
  prompt: After the payment pod was restarted, every order fails. The new payment pod is Running and Ready, and
    its endpoints look correct. Find the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:checkout
  root_cause:
  - kube-proxy
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl -n kube-system patch daemonset kube-proxy --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector/proxy-tier"}]'
  - kubectl -n kube-system rollout status daemonset/kube-proxy --timeout=180s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: platform
  mechanism: platform/service-proxy-down
  title: kube-proxy removed; Service rules go stale when a pod moves
  generated: true
  est_pass_rate: null
  split: train
