ground_truth:
  root_causes:
  - component: daemonset/kube-proxy
    namespace: kube-system
    what: a nodeSelector that matches no node removed kube-proxy, so Service rules went stale when payment's pod
      moved
  explanation: kube-proxy (which programs Service IPs into node network rules) was removed by a nodeSelector no
    node matches. The old rules stay in place, so nothing breaks until an endpoint changes. When payment got a new
    pod IP, the `payment` Service kept sending traffic to the old IP.
  evidence:
  - Endpoints for `payment` show the new pod IP, yet checkout cannot connect.
  - '`kubectl -n kube-system get pods -l k8s-app=kube-proxy`: none running.'
  - '`kubectl -n kube-system get ds kube-proxy -o yaml`: nodeSelector `proxy-tier=disabled`.'
