ground_truth:
  root_causes:
  - component: persistentvolumeclaim/valkey-data
    namespace: default
    what: asks for StorageClass premium-rwo, which does not exist here, so it is never provisioned and the valkey-cart
      pod that mounts it stays Pending
  explanation: 'valkey-cart (the cart''s Redis-compatible store) was moved onto a PersistentVolumeClaim `valkey-data`
    with `storageClassName: premium-rwo`, a class name copied from another cloud. This cluster only has the `standard`
    class, so the claim is never provisioned (ProvisioningFailed: storageclass "premium-rwo" not found), the new
    valkey-cart pod is Pending (unbound PersistentVolumeClaim), and with the Recreate strategy the old pod is already
    gone: every cart call times out.'
  evidence:
  - '`kubectl get pods -l opentelemetry.io/name=valkey-cart`: Pending; `kubectl describe pod`: pod has unbound immediate
    PersistentVolumeClaims.'
  - '`kubectl get pvc valkey-data`: Pending, STORAGECLASS premium-rwo.'
  - '`kubectl describe pvc valkey-data`: ProvisioningFailed, storageclass.storage.k8s.io "premium-rwo" not found.'
  - '`kubectl get storageclass`: only `standard` (default).'
reference:
  commands:
  - kubectl delete pvc valkey-data --wait=false
  - kubectl delete pod -l opentelemetry.io/name=valkey-cart --wait=false
  - sleep 10
  - |-
    cat <<'EOF' | kubectl apply -f -
    apiVersion: v1
    kind: PersistentVolumeClaim
    metadata: {name: valkey-data, namespace: default}
    spec:
      accessModes: [ReadWriteOnce]
      resources: {requests: {storage: 1Gi}}
    EOF
  - kubectl rollout status deployment/valkey-cart --timeout=180s
  fix: 'A PVC''s storageClassName cannot be changed: delete the claim (and the Pending pod that holds it) and recreate
    it without a class (or with `standard`). Removing the volume from valkey-cart (back to its old ephemeral storage)
    also works. Creating a StorageClass is not possible with the on-call permissions here.'
