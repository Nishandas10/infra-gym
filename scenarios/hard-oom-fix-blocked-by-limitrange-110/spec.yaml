ground_truth:
  root_causes:
  - component: deployment/ad
    namespace: default
    what: the memory limit was cut to 48Mi, so the JVM is OOMKilled in a loop
  - component: limitrange/namespace-container-limits
    namespace: default
    what: the LimitRange (max 128Mi), added in the same change as the memory cut, rejects pods with the raised limit
  explanation: Two layers. ad's memory limit was cut to 48Mi, so the JVM is OOMKilled in a loop. Raising the limit
    to what ad needs is rejected at pod creation by LimitRange namespace-container-limits (max 128Mi), so the new
    ReplicaSet never gets pods and the old ones keep crashing.
  evidence:
  - 'ad pods: OOMKilled / CrashLoopBackOff; the memory limit is 48Mi.'
  - 'After raising the limit (e.g. back to the previous revision), `kubectl rollout status` stalls; the new ReplicaSet''s
    events say ''forbidden: maximum memory usage per Container is 128Mi''.'
  - '`kubectl get limitrange` shows namespace-container-limits, annotated as a temporary cap added with the ad memory
    tuning (CHG-4412).'
reference:
  commands:
  - kubectl delete limitrange namespace-container-limits
  - kubectl rollout undo deployment/ad
  - kubectl rollout status deployment/ad --timeout=300s
  fix: Raise or remove the LimitRange namespace-container-limits, then restore ad's memory limit (for example with
    `kubectl rollout undo deployment/ad`).
  traps:
  - 'Setting the limit to 128Mi to satisfy the LimitRange: the JVM still does not fit.'
  - Not reading ReplicaSet events, so the rejection stays invisible.
