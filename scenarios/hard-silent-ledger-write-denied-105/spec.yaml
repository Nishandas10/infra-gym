id: hard-silent-ledger-write-denied-105
seed: 1105
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: create_objects
    noise: true
    manifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: orders-export-s3-nightly
        namespace: default
        labels: &id001
          app: orders-export-s3-nightly
          team: finance-data
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels: *id001
          spec:
            restartPolicy: Never
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sh
              - -c
              - 'echo "export failed: S3 PutObject AccessDenied (bucket finance-exports, key orders/2026-10-08.csv)"
                >&2; exit 1'
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                requests:
                  memory: 8Mi
                  cpu: 5m
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: fraud-model-retrain
        namespace: default
        labels: &id002
          app: fraud-model-retrain
          team: ml-platform
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: fraud-model-retrain
        template:
          metadata:
            labels: *id002
          spec:
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sleep
              - infinity
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                  nvidia.com/gpu: 1
                requests:
                  memory: 8Mi
                  cpu: 5m
                  nvidia.com/gpu: 1
  - type: exec_commands
    target: deploy/astronomy-db
    commands:
    - - psql
      - -U
      - postgres
      - -d
      - astronomy_db
      - -c
      - REVOKE INSERT ON accounting."order" FROM astronomy_user
    undo_commands:
    - - psql
      - -U
      - postgres
      - -d
      - astronomy_db
      - -c
      - GRANT INSERT ON accounting."order" TO astronomy_user
task:
  mode: diagnose_and_mitigate
  prompt: Finance says orders placed in the last half hour are missing from the accounting ledger, although customers
    can check out and receive confirmations. Find the cause and fix it.
tools:
- kubectl
- curl
verifier:
  outcome:
  - orders_recorded
  - journey:checkout
  root_cause:
  - silent-async-write-permission
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: orders_recorded
    timeout_s: 90
  - type: journey
    journey: checkout
    repeat: 2
    max_error_pct: 0
    max_avg_ms: 5000
solution:
  commands:
  - kubectl exec deploy/astronomy-db -- psql -U postgres -d astronomy_db -c 'GRANT INSERT ON accounting."order"
    TO astronomy_user'
  - kubectl rollout restart deployment/accounting
  - kubectl rollout status deployment/accounting --timeout=300s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 60
  poll_s: 10
  baseline_timeout_s: 180
budget:
  max_steps: 40
  wall_s: 1200
