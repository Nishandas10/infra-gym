id: wl-readiness-never-ready-024
seed: 1024
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: cart
  strategy: Recreate
  ops:
  - op: set
    path: /spec/template/spec/containers/$c/readinessProbe
    value:
      httpGet:
        path: /healthz
        port: 8080
      periodSeconds: 5
task:
  mode: diagnose_and_mitigate
  prompt: 'The cart is broken for everyone: adding items fails and orders fail. The cart pod is Running. Find the
    cause and fix it.'
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:cart
  - endpoints:cart
  root_cause:
  - cart
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: endpoints
    service: cart
solution:
  commands:
  - kubectl patch deployment cart --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/readinessProbe"}]'
  - kubectl rollout status deployment/cart --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/readiness-probe-misconfigured
  title: Readiness probe can never succeed -> no endpoints
  generated: true
  est_pass_rate: null
  split: train
