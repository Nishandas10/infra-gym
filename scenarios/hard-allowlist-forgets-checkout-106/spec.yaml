id: hard-allowlist-forgets-checkout-106
seed: 1106
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: object_patch
    noise: true
    kind: deployment
    name: payment
    ops:
    - op: set
      path: /metadata/annotations/kubernetes.io~1change-cause
      value: 'payment: bump payment-sdk 4.1.7 -> 4.2.0 (CHG-3317)'
  - type: workload_patch
    noise: true
    target: payment
    recreate_pods: false
    pause_s: 20
    ops:
    - op: set
      path: /spec/template/metadata/annotations/deploy.example.com~1release
      value: 2026.10.08-1
  - type: create_objects
    recreate_pods_after:
    - opentelemetry.io/name=product-catalog
    manifests:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: product-catalog-allow-clients
        namespace: default
        labels:
          security.example.com/ticket: ZT-104
        annotations:
          security.example.com/summary: 'Zero-trust: only known clients may call product-catalog'
      spec:
        podSelector:
          matchLabels:
            opentelemetry.io/name: product-catalog
        policyTypes:
        - Ingress
        ingress:
        - from:
          - podSelector:
              matchExpressions:
              - key: opentelemetry.io/name
                operator: In
                values:
                - frontend
                - recommendation
          ports:
          - protocol: TCP
            port: 8080
