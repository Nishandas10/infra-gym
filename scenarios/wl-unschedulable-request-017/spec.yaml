id: wl-unschedulable-request-017
seed: 1017
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: recommendation
  strategy: Recreate
  ops:
  - op: replace
    path: /spec/template/spec/containers/$c/resources
    value:
      limits:
        memory: 64Gi
      requests:
        memory: 64Gi
task:
  mode: diagnose_and_mitigate
  prompt: The 'You may also like' panel is empty on every product page since this morning's resource tuning. Find
    the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:recommendations
  - pods_ready:opentelemetry.io/name=recommendation
  root_cause:
  - recommendation
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: recommendations
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=recommendation
solution:
  commands:
  - kubectl set resources deployment/recommendation -c recommendation --limits=memory=500Mi --requests=memory=500Mi
  - kubectl rollout status deployment/recommendation --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/unschedulable-resource-request
  title: Memory request larger than any node -> Pending
