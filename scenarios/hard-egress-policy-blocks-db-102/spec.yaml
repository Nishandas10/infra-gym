id: hard-egress-policy-blocks-db-102
seed: 1102
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  restart_on_revert:
  - deployment/product-catalog
  steps:
  - type: create_objects
    noise: true
    manifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: astronomy-db-backup-nightly
        namespace: default
        labels: &id001
          app: astronomy-db-backup-nightly
          team: data-platform
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels: *id001
          spec:
            restartPolicy: Never
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sh
              - -c
              - 'echo "pg_dump: error: connection to server at "astronomy-db" port 5432 failed: FATAL:  password
                authentication failed for user "backup"" >&2; exit 1'
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                requests:
                  memory: 8Mi
                  cpu: 5m
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-search-indexer
        namespace: default
        labels: &id002
          app: catalog-search-indexer
          team: search
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: catalog-search-indexer
        template:
          metadata:
            labels: *id002
          spec:
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sh
              - -c
              - 'echo "ERROR indexer: could not connect to astronomy-db:5432 (timeout after 5s); search index is
                stale" >&2; sleep 5; exit 1'
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                requests:
                  memory: 8Mi
                  cpu: 5m
  - type: create_objects
    recreate_pods_after:
    - opentelemetry.io/name=product-catalog
    manifests:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: product-catalog-egress-hardening
        namespace: default
        labels:
          security.example.com/ticket: SEC-2291
        annotations:
          security.example.com/summary: Restrict product-catalog egress to known service ports
      spec:
        podSelector:
          matchLabels:
            opentelemetry.io/name: product-catalog
        policyTypes:
        - Egress
        egress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
          ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
        - ports:
          - protocol: TCP
            port: 8080
          - protocol: TCP
            port: 4317
          - protocol: TCP
            port: 4318
          - protocol: TCP
            port: 8013
          - protocol: TCP
            port: 8016
          - protocol: TCP
            port: 443
task:
  mode: diagnose_and_mitigate
  prompt: Product pages and the product list have been failing for about ten minutes. Alerts show database connection
    errors. Find the cause and fix it.
tools:
- kubectl
- curl
verifier:
  outcome:
  - journey:browse
  - journey:catalog
  root_cause:
  - egress-allowlist-omits-dependency-port
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl patch networkpolicy product-catalog-egress-hardening --type=json -p '[{"op":"add","path":"/spec/egress/1/ports/-","value":{"protocol":"TCP","port":5432}}]'
  - kubectl rollout restart deployment/product-catalog
  - kubectl rollout status deployment/product-catalog --timeout=300s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 60
  poll_s: 10
  baseline_timeout_s: 180
budget:
  max_steps: 40
  wall_s: 1200
