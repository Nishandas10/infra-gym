id: webhook-blocks-pods-050
seed: 1050
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: create_objects
  recreate_pods_after:
  - opentelemetry.io/name=email
  manifests:
  - apiVersion: admissionregistration.k8s.io/v1
    kind: ValidatingWebhookConfiguration
    metadata:
      name: pod-policy-guard
    webhooks:
    - name: pods.policy-guard.gym.local
      admissionReviewVersions:
      - v1
      sideEffects: None
      failurePolicy: Fail
      timeoutSeconds: 5
      clientConfig:
        service:
          namespace: gym-system
          name: policy-guard
          port: 443
          path: /validate
      rules:
      - operations:
        - CREATE
        apiGroups:
        - ''
        apiVersions:
        - v1
        resources:
        - pods
      namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: default
task:
  mode: diagnose_and_mitigate
  prompt: Order confirmation emails stopped after the email pod restarted, and no new email pod appears. Find the
    cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:email
  - pods_ready:opentelemetry.io/name=email
  root_cause:
  - admission-webhook
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: email
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=email
solution:
  commands:
  - kubectl delete validatingwebhookconfiguration pod-policy-guard
  - kubectl rollout restart deployment/email
  - kubectl rollout status deployment/email --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: platform
  mechanism: platform/admission-webhook-unavailable
  title: Validating webhook with failurePolicy=Fail and no backend
  generated: true
  est_pass_rate: null
  split: train
