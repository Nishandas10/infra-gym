id: hard-masked-second-fault-107
seed: 1107
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: create_objects
    noise: true
    manifests:
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: recsys-embedding-backfill
        namespace: default
        labels: &id001
          app: recsys-embedding-backfill
          team: ml-platform
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: recsys-embedding-backfill
        template:
          metadata:
            labels: *id001
          spec:
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sleep
              - infinity
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                  nvidia.com/gpu: 1
                requests:
                  memory: 8Mi
                  cpu: 5m
                  nvidia.com/gpu: 1
  - type: object_patch
    kind: service
    name: shipping
    restart_after:
    - deployment/shipping
    ops:
    - op: replace
      path: /spec/ports/0/targetPort
      value: 8888
  - type: workload_patch
    target: checkout
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:PRODUCT_CATALOG_ADDR/value
      value: product-catalog:9090
task:
  mode: diagnose_and_mitigate
  prompt: Checkout fails for every order. Find the cause and fix it.
tools:
- kubectl
- curl
verifier:
  outcome:
  - journey:checkout
  root_cause:
  - sequential-masked-faults
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl set env deployment/checkout PRODUCT_CATALOG_ADDR=product-catalog:8080
  - kubectl rollout status deployment/checkout --timeout=300s
  - kubectl patch service shipping --type=json -p '[{"op":"replace","path":"/spec/ports/0/targetPort","value":8080}]'
