ground_truth:
  root_causes:
  - component: service/currency
    namespace: default
    what: internalTrafficPolicy is Local, so only clients on the node of the single currency pod can reach it
  explanation: 'The currency Service was set to `internalTrafficPolicy: Local`, so kube-proxy sends in-cluster traffic
    only to a currency pod on the caller''s own node and drops it otherwise. Currency has one replica, and frontend
    and checkout run on another node, so their calls time out while the currency pod, its endpoint and its logs
    all look healthy.'
  evidence:
  - '`kubectl logs deploy/checkout`: currency calls time out or are unavailable.'
  - '`kubectl get pods -o wide`: currency runs on a different node than frontend and checkout.'
  - '`kubectl get endpointslices -l kubernetes.io/service-name=currency`: one ready endpoint.'
  - '`kubectl get svc currency -o yaml`: `internalTrafficPolicy: Local`; every other Service uses `Cluster`.'
  - A test pod on the currency pod's node connects to currency:8080; one on the other worker node times out.
reference:
  commands:
  - kubectl patch service currency --type=json -p '[{"op":"replace","path":"/spec/internalTrafficPolicy","value":"Cluster"}]'
  fix: Set `internalTrafficPolicy` back to `Cluster` (removing the field has the same effect). Moving frontend or
    checkout onto the currency pod's node, or scaling currency up, only hides the fault for the nodes that happen
    to have a currency pod.
