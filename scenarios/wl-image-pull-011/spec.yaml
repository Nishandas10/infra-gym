id: wl-image-pull-011
seed: 1011
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: workload_patch
  target: currency
  strategy: Recreate
  ops:
  - op: replace
    path: /spec/template/spec/containers/$c/image
    value: ghcr.io/open-telemetry/demo:3.1.0-curency
task:
  mode: diagnose_and_mitigate
  prompt: Prices no longer show when customers switch currency, and every order fails. Find the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:currency
  - journey:checkout
  - pods_ready:opentelemetry.io/name=currency
  root_cause:
  - currency
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: currency
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=currency
solution:
  commands:
  - kubectl set image deployment/currency currency=ghcr.io/open-telemetry/demo:3.1.0-currency
  - kubectl rollout status deployment/currency --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: workload
  mechanism: workload/image-pull-failure
  title: Mistyped image tag -> ImagePullBackOff
  generated: true
  est_pass_rate: null
  split: train
