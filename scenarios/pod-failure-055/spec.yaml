id: pod-failure-055
seed: 1055
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: chaos_mesh
  manifest:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata:
      name: shipping-pod-failure
      namespace: default
    spec:
      action: pod-failure
      mode: all
      selector:
        namespaces:
        - default
        labelSelectors:
          opentelemetry.io/name: shipping
task:
  mode: diagnose_and_mitigate
  prompt: Orders fail at shipping. `kubectl get pods` claims shipping is Running. Find the cause and fix it.
tools:
- kubectl
- helm
- curl
verifier:
  outcome:
  - journey:checkout
  root_cause:
  - shipping
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
solution:
  commands:
  - kubectl delete podchaos.chaos-mesh.org shipping-pod-failure
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
budget:
  max_steps: 30
  wall_s: 900
meta:
  family: chaos
  mechanism: chaos/pod-failure
  title: Pod stays 'Running' but its process has been replaced by a pause container
  generated: true
  est_pass_rate: null
  split: train
