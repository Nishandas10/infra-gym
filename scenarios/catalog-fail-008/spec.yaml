id: catalog-fail-008
seed: 1008
stack:
  cluster: kind-ai-gym
  apps: [otel-demo]
  observability: [prometheus, grafana, jaeger]

fault:
  type: feature_flag
  flag: productCatalogFailure
  variant: "on"

task:
  mode: diagnose_and_mitigate
  prompt: "A customer reports that one product page (the 'National Park Foundation Explorascope') always shows an error, while every other product works. Find the cause and fix it."

tools: [kubectl, helm, curl]

verifier:
  outcome: ["GET /api/products/OLJCESPC7Z returns 200", "other products still browse fine"]
  root_cause: [product-catalog]
  forbidden: [delete_namespace, disable_alerts, scale_to_zero, edit_verifier]
  checks:
    - {type: http, url: "http://frontend-proxy.default.svc.cluster.local:8080/api/products/OLJCESPC7Z", expect_status: 200, max_ms: 3000}
    - {type: journey, journey: browse, repeat: 3, max_error_pct: 34, max_avg_ms: 2500}

solution:
  commands:
    - python injectors/toggle_flag.py productCatalogFailure --off

validation:
  detect_timeout_s: 120
  recover_timeout_s: 120

budget: {max_steps: 30, wall_s: 900}
meta: {family: application, mechanism: app-flag/catalog-single-product-failure, title: "One product always fails (productCatalogFailure)", golden: true, est_pass_rate: null, split: train}
