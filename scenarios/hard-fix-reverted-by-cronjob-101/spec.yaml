  - kubectl set env deployment/payment PAYMENT_PORT=8080
  - kubectl rollout status deployment/payment --timeout=300s
  fix: Stop the payment-config-sync CronJob (delete or suspend it, and make sure none of its Jobs is still running)
    and set PAYMENT_PORT back to 8080.
  traps:
