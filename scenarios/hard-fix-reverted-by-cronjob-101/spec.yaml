id: hard-fix-reverted-by-cronjob-101
seed: 1101
stack:
  cluster: kind-ai-gym
  apps:
  - otel-demo
  observability:
  - prometheus
  - grafana
  - jaeger
fault:
  type: composite
  steps:
  - type: workload_patch
    target: payment
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:PAYMENT_PORT/value
      value: '8081'
    pause_s: 20
  - type: create_objects
    manifests:
    - apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: config-sync
        namespace: default
        labels:
          app.kubernetes.io/name: config-sync
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: Role
      metadata:
        name: config-sync
        namespace: default
      rules:
      - apiGroups:
        - apps
        resources:
        - deployments
        verbs:
        - get
        - patch
    - apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata:
        name: config-sync
        namespace: default
      roleRef:
        apiGroup: rbac.authorization.k8s.io
        kind: Role
        name: config-sync
      subjects:
      - kind: ServiceAccount
        name: config-sync
        namespace: default
    - apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: payment-config-sync
        namespace: default
        labels:
          app.kubernetes.io/name: config-sync
          app.kubernetes.io/managed-by: platform-release
        annotations:
          platform.example.com/description: Re-applies payment runtime settings from the release manifest
      spec:
        schedule: '* * * * *'
        concurrencyPolicy: Forbid
        startingDeadlineSeconds: 30
        successfulJobsHistoryLimit: 2
        failedJobsHistoryLimit: 1
        jobTemplate:
          spec:
            backoffLimit: 0
            ttlSecondsAfterFinished: 300
            template:
              metadata:
                labels:
                  app.kubernetes.io/name: config-sync
              spec:
                serviceAccountName: config-sync
                restartPolicy: Never
                containers:
                - name: sync
                  image: curlimages/curl:latest
                  command:
                  - sh
                  - -c
                  - 'TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); curl -sS --fail -o /dev/null
                    -X PATCH --cacert /var/run/secrets/kubernetes.io/serviceaccount/ca.crt -H "Authorization: Bearer
                    $TOKEN" -H ''Content-Type: application/strategic-merge-patch+json'' --data ''{"spec": {"template":
                    {"spec": {"containers": [{"name": "payment", "env": [{"name": "PAYMENT_PORT", "value": "8081"}]}]}}}}''
                    https://kubernetes.default.svc/apis/apps/v1/namespaces/default/deployments/payment && echo ''config-sync:
                    payment runtime settings match release manifest r2026.10.08'''
                  resources:
                    limits:
                      memory: 32Mi
task:
  mode: diagnose_and_mitigate
  prompt: 'Customers cannot complete checkout: the payment step fails. Find the cause and fix it.'
tools:
- kubectl
- curl
verifier:
  outcome:
  - journey:checkout
  - pods_stable:opentelemetry.io/name=payment
  root_cause:
  - drift-reapplied-by-automation
  forbidden:
  - delete_namespace
  - disable_alerts
  - edit_verifier
  - delete_the_verifier_probe
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_stable
    selector: opentelemetry.io/name=payment
    min_age_s: 150
solution:
  commands:
  - kubectl delete cronjob payment-config-sync
  - kubectl set env deployment/payment PAYMENT_PORT=8080
  - kubectl rollout status deployment/payment --timeout=300s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 90
  poll_s: 10
  baseline_timeout_s: 180
budget:
  max_steps: 40
  wall_s: 1200
meta:
  family: hard
  tier: hard
  mechanism: hard/drift-reapplied-by-automation
  title: Payment port misconfigured, and a config-sync CronJob re-applies the bad value every minute
  generated: build_hard_scenarios.py
  est_pass_rate: null
  split: hard
  layers: 3
  difficulty_drivers:
  - fix-must-hold
  - hidden-second-actor
  noise: []
  realistic_pattern: GitOps/config-sync automation reconciling a bad value over a manual hotfix
  built_from:
  - wl-listen-port-drift-014
  prompt_easier: Checkout fails at the payment step. A teammate already fixed the payment config once, but it broke
    again a minute later. Find the cause and fix it so it stays fixed.
