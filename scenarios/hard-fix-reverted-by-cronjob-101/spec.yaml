    what: PAYMENT_PORT is 8081 while the payment Service targets 8080
  - component: cronjob/payment-config-sync
    namespace: default
    what: the CronJob re-applies PAYMENT_PORT=8081 every minute
  explanation: payment listens on 8081 while its Service targets 8080. A CronJob (payment-config-sync, labelled
    as platform automation) PATCHes PAYMENT_PORT=8081 back every minute, so fixing the Deployment alone is undone
    within 60 seconds.
  evidence:
  - 'checkout logs: charging the card fails with ''connection refused'' to the payment Service.'
  - payment logs say it listens on 8081; `kubectl get svc payment` targets 8080. Env PAYMENT_PORT=8081.
  - Once the env var is corrected, checkout recovers, but within a minute payment rolls again and breaks.
  - '`kubectl rollout history deployment/payment`, the deployment''s managedFields (manager ''curl'') and `kubectl
    get cronjobs,jobs` show payment-config-sync re-applying the bad value every minute.'
