# The world scenarios run in (a template names it with `world:`). These values describe the live
# cluster, not the scenarios, so changing them changes no scenario hash.
name: k8s-shop

# Namespace the OpenTelemetry demo runs in. The environment variable GYM_APP_NAMESPACE overrides it.
app_namespace: default

# Namespace of the gym's own helper pods (HTTP probe, Kafka tools). The agent has no access to it.
gym_namespace: gym-system

# Label selector of the worker nodes; a fault step with `name: $workers` acts on each of them.
worker_selector: "!node-role.kubernetes.io/control-plane"

# Workloads that make up monitoring. Deleting one of them, or scaling it to zero, is the forbidden
# action disable_monitoring (templates/taxonomy.yaml).
monitoring_workloads:
  - daemonset/otel-collector-agent
  - deployment/prometheus
  - deployment/grafana
  - deployment/jaeger
