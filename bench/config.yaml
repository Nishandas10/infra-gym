# ============================================================================
# Benchmark configuration: 12 models (Claude x2, Gemini x2 and DeepSeek V4 Pro on their own APIs, 7 through OpenRouter)
# Copy over config.yaml:   cp bench/config.full.yaml bench/config.yaml
# Keys live in the repo's .env file:  ANTHROPIC_API_KEY=...  GEMINI_API_KEY=...  DEEPSEEK_API_KEY=...  OPENROUTER_API_KEY=...
# Prices are $ per 1M tokens (used by cost.py / report.py; check them before a big run,
# some are temporary discounts). Model IDs: see openrouter.ai/<id>.
# ============================================================================

# Default provider for every model below that does not set its own base_url
base_url: https://openrouter.ai/api/v1
api_key_env: OPENROUTER_API_KEY
timeout_s: 300                      # seconds to wait for one model reply
send_temperature: false             # every model runs at its provider's recommended default temperature

models:
  # --- Claude, native API: effort + automatic prompt caching (see agent_bench.py anthropic_chat)
  - id: claude-opus-5-5
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    effort: high
    max_tokens: 16000
    timeout_s: 600
    price: {input: 4, output: 20, cache_read: 0.20, cache_write: 5}

  # --- Claude Sonnet 5.5, native API (calibration, 2026-10-18). Thinking is adaptive (the param is omitted); effort high
  # is also its default, set explicitly so the row records it. Cache write = 1.25x input (5-minute TTL).
  - id: claude-sonnet-5-5
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    effort: high
    max_tokens: 16000
    timeout_s: 600
    price: {input: 2, output: 10, cache_read: 0.20, cache_write: 2.50}

  # --- Gemini 4 Argon, native Gemini API (calibration, 2026-10-18; id checked against the API's model list: thinking
  # supported, 32,768 output tokens max). Introductory price until 2026-11-30. May need a paid-tier key.
  - id: gemini-4-argon
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    thinking_level: high
    max_tokens: 32000
    timeout_s: 300
    price: {input: 2, output: 10, cache_read: 0.10}

  # --- OpenRouter: fastest provider that supports tools (and reasoning where set). For these the row's cost is what
  # OpenRouter billed (usage.cost, per serving host); the prices below are its listed default route (2026-10-18),
  # used only when a reply carries no cost.
  - id: openai/gpt-6.1-sol
    extra_body: {reasoning: {effort: high}, provider: {sort: throughput, require_parameters: true}}
    price: {input: 2, output: 10, cache_read: 0.10}

  - id: z-ai/glm-5.3
    extra_body: {reasoning: {effort: high}, provider: {sort: throughput, require_parameters: true}}
    price: {input: 0.079, output: 2.5, cache_read: 0.078}

  - id: openai/gpt-5.6-sol
    extra_body: {reasoning: {effort: high}, provider: {sort: throughput, require_parameters: true}}
    price: {input: 2, output: 10, cache_read: 0.20}

  # --- Gemini 3.8 Flash, native Gemini API with a Google AI Studio key (GEMINI_API_KEY in .env)
  # thinking level high. Prompt caching = Gemini's implicit caching: automatic once the conversation
  # passes 4,096 tokens, no write or storage cost; cached tokens are reported per call.
  # Prices: introductory until 2026-12-31; from 2027-01-01 input 1.50, output 7.50, cache_read 0.15.
  - id: gemini-3.8-flash
    base_url: https://generativelanguage.googleapis.com/v1beta
    api_key_env: GEMINI_API_KEY
    thinking_level: high
    max_tokens: 32000
    timeout_s: 300
    min_seconds_between_calls: 0      # free tier: set to 7 (about 8 requests per minute)
    price: {input: 0.75, output: 3.75, cache_read: 0.075}

  - id: moonshotai/kimi-k3
    extra_body: {provider: {sort: throughput, require_parameters: true}}
    price: {input: 0.304, output: 11.936, cache_read: 0.21}

  # --- DeepSeek V4 Pro (V4-Pro-0813), native DeepSeek API (DEEPSEEK_API_KEY in .env). Thinking on (DeepSeek's
  # default, set explicitly); its reasoning_content is sent back each turn (required with tools). Prompt caching is
  # DeepSeek's automatic disk cache (hits reported as prompt_cache_hit_tokens). Prices are the off-peak rates;
  # peak hours (weekdays 01:00-04:00 and 06:00-10:00 UTC) cost double, which cost.py does not model.
  - id: deepseek-v4-pro
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    extra_body: {thinking: {type: enabled}, reasoning_effort: high}
    timeout_s: 600
    price: {input: 0.66, cache_read: 0.022, output: 1.98}

  - id: deepseek/deepseek-v4.1-flash
    extra_body: {provider: {sort: throughput, require_parameters: true}}
    price: {input: 0.0356, output: 1}

  - id: openai/gpt-5.6-luna
    extra_body: {provider: {sort: throughput, require_parameters: true}}
    price: {input: 0.20, output: 1.20, cache_read: 0.02}

  - id: z-ai/glm-5.3-flash
    extra_body: {provider: {sort: throughput, require_parameters: true}}
    price: {input: 0.04, output: 0.50}

# ---- Which scenarios (runs normally use --set; these are the defaults otherwise)
# Scenarios with bench_eligible: false (Chaos Mesh: the fix is deleting the chaos object) are always excluded.
only_golden: false
only_validated: true                # only scenarios whose current version is validated (gym/core/status.py)
include: []
exclude: []

# ---- Identical for every model
attempts_per_model: 1
temperature: 0.2                    # only used if send_temperature is switched on
default_max_steps: 40               # Hard scenarios set their own budget (40 commands)
default_wall_s: 900                 # seconds of command time (API waiting is not counted)
