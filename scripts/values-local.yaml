# Local overrides for the OpenTelemetry demo chart (opentelemetry-demo 0.42.0).
#
# Why: the kind cluster runs inside WSL, which .wslconfig caps at 6 GB RAM.
# The full demo needs more than that and the VM thrashed (load average > 300,
# API server timing out). These overrides switch off optional, memory-heavy
# parts that no scenario needs, freeing roughly 1.5 GB.
#
# To restore any of them, delete the matching block here and run
# scripts/reset_world.sh.

# Log storage backend (a JVM process, ~1 GB). Logs are no longer stored;
# traces (Jaeger) and metrics (Prometheus) are unaffected.
opensearch:
  enabled: false

# The flag clients (OpenFeature flagd providers) cached flag values and flushed them only on a change event. After
# `kubectl rollout restart deployment/flagd` flagd served the flag off, but ad kept burning 3.6 cores and checkout kept
# failing for 7+ minutes on the cached value, and a revert that rewrote an unchanged value left the next episode
# broken (oracle PROBLEMs of 007, 010 and 065, 2026-10-17). With the cache off every evaluation asks flagd.
# default.envOverrides is added to every component that uses the chart's default env (all the flag clients).
default:
  envOverrides:
    - name: FLAGD_CACHE
      value: disabled

components:
  # AI shopping-assistant services (~450 MB together). They need an LLM
  # provider to do anything useful and are not part of the shop's checkout path.
  chatbot:
    enabled: false
  agent:
    enabled: false
  mcp:
    enabled: false

  # Keep the HTTP load generator but drop the headless-browser users, which
  # spawn Chromium and are the heaviest part of the load generator.
  load-generator:
    envOverrides:
      - name: LOCUST_BROWSER_TRAFFIC_ENABLED
        value: "false"

  # The chart's 20Mi limits leave these services no room for their own page
  # cache. product-catalog sat at 19/20Mi, constantly re-reading its binary,
  # which made browsing take 1-3s and checkout time out at baseline.
  product-catalog:
    resources:
      limits:
        memory: 64Mi
  checkout:
    resources:
      limits:
        memory: 64Mi
  currency:
    resources:
      limits:
        memory: 64Mi
  shipping:
    resources:
      limits:
        memory: 64Mi
  # fraud-detection (a JVM with the OpenTelemetry Java agent) outgrew the chart's 300Mi: it was OOMKilled every
  # few hours on its own, and a world check that caught it in crash-loop backoff found its Kafka consumer group
  # empty for minutes (RESTORE_FAILED in 019, 113 and 115, 2026-10-14 to 2026-10-16).
  fraud-detection:
    resources:
      limits:
        memory: 450Mi
  # ad (a JVM) was OOMKilled every 10-20 minutes at the chart's 300Mi (113 restarts on one cluster in two days), and
  # a crash-looping ad pod fails the world check (pods_ready) of whatever scenario runs at that moment.
  ad:
    resources:
      limits:
        memory: 450Mi
  # The Kafka broker (400M heap) was OOMKilled at 700Mi after ~20 minutes of kafka-backlog-010's flood (2026-10-17
  # 03:46, 642MB anon RSS). A broker restart leaves checkout's producer wedged, so checkout failed with 504s for the
  # rest of that episode and after it; only restarting every pod recovered the shop.
  #
  # 2026-10-20: 1Gi -> 2Gi, and the broker's data on an emptyDir. The broker sits at ~710MB of the limit, and every
  # Kafka CLI an agent runs inside the broker pod (kubectl exec deploy/kafka -- kafka-*.sh) inherits
  # KAFKA_HEAP_OPTS=-Xms400M, so one or two of them OOMKilled the broker (Sonnet 5.5 on
  # hard-kafka-consumer-quota-130). Its log dirs were in /tmp on the container's filesystem, so the restart also lost
  # the topics and offsets and wedged checkout's producer: a correct fix graded as made_worse. 2Gi leaves room for two
  # CLI runs at once; the emptyDir keeps the data through a container restart (a pod deletion still starts empty,
  # as before, so scenarios that delete or scale the broker behave as they did).
  kafka:
    resources:
      limits:
        memory: 2Gi
    mountedEmptyDirs:
      - name: kafka-data
        mountPath: /tmp

# Jaeger keeps traces in memory. At the chart's cap of 25,000 traces it grew to
# ~330 MB during long validation runs, and the shrinking headroom let a single
# rolling restart thrash the VM. 5,000 traces still cover several minutes of
# traffic; no scenario check looks back more than 2 minutes.
# Helm replaces lists, so this repeats the chart's whole extraEnv list.
jaeger:
  jaeger:
    extraEnv:
      - name: MEMORY_MAX_TRACES
        value: "5000"
      - name: PROMETHEUS_ADDR
        value: prometheus:9090
      - name: OTEL_COLLECTOR_HOST
        value: otel-collector
      - name: OTEL_COLLECTOR_PORT_HTTP
        value: "4318"
      - name: JAEGER_HOST
        value: "0.0.0.0"
      - name: JAEGER_GRPC_PORT
        value: "4317"

opentelemetry-collector:
  config:
    service:
      pipelines:
        # The default logs pipeline exports to OpenSearch, which is disabled above.
        logs:
          exporters: [debug]

# Prometheus sat at its 400Mi limit on every cluster (peak 400M, 2026-10-17). On ai-gym-3 it was OOMKilled and then
# crash-looped (the WAL replay after the kill needs more memory again) until its pod was deleted, which failed the
# world check of 125's long hold and its oracle episode.
prometheus:
  server:
    resources:
      limits:
        memory: 768Mi

# Grafana's default 300Mi limit got it OOM-killed during startup on the GCP VM.
grafana:
  resources:
    limits:
      memory: 512Mi
