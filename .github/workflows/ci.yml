name: ci

on:
  push:
  pull_request:

jobs:
  offline:
    # Everything that needs no cluster: lint, static scenario checks, inject/revert against the
    # fake cluster (tests/fixtures/world.json), and the scenario behaviour snapshot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check . --select E9,F
      - run: python scripts/generate.py --check
      - run: python scripts/lint_scenarios.py
      - run: python scripts/make_suite.py --check
      - run: pytest
