spec_version: 2
id: pg-revoked-grant-078
version: 1
title: Database role lost SELECT on the table the service reads
mechanism: datastore/db-permission-revoked
split: train
seed: 1078
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The product catalog returns errors on every page. Find the cause and fix it.
    ticket: The product catalog returns errors on every page, right after a database permissions audit. Find the
      cause and fix it.
tags:
  layer: datastore
  symptom: hard-errors
  fix_type:
  - datastore-cmd
  injector: exec
fault:
  steps:
  - mechanism: runtime.exec
    target: deploy/astronomy-db
    commands:
    - - psql
      - -U
      - postgres
      - -d
      - astronomy_db
      - -c
      - REVOKE SELECT ON catalog.products FROM astronomy_user
    undo_commands:
    - - psql
      - -U
      - postgres
      - -d
      - astronomy_db
      - -c
      - GRANT SELECT ON catalog.products TO astronomy_user
verifier:
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: deployment/astronomy-db
    namespace: default
    what: SELECT on catalog.products was revoked from astronomy_user, the role product-catalog connects as
  explanation: The audit revoked `SELECT` on `catalog.products` from `astronomy_user`, the role product-catalog
    connects as. Every query fails with `permission denied for table products`.
  evidence:
  - 'product-catalog logs: `permission denied for table products`.'
  - '`psql ... -c ''\dp catalog.products''`: astronomy_user has no SELECT.'
  - Re-grant the privilege.
reference:
  commands:
  - kubectl exec deploy/astronomy-db -- psql -U postgres -d astronomy_db -c 'GRANT SELECT ON catalog.products TO
    astronomy_user'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
