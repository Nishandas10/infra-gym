spec_version: 2
id: valkey-maxmemory-075
version: 1
title: Valkey memory cap reached with 'noeviction' -> writes rejected
mechanism: datastore/kv-memory-cap-noeviction
split: train
seed: 1075
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Customers can view their carts but adding an item fails. Find the cause and fix it.
tags:
  layer: datastore
  symptom: hard-errors
  fix_type:
  - datastore-cmd
  drivers:
  - partial-impact
  injector: exec
fault:
  steps:
  - mechanism: runtime.exec
    target: deploy/valkey-cart
    commands:
    - - valkey-cli
      - CONFIG
      - SET
      - maxmemory
      - 256kb
    undo_commands:
    - - valkey-cli
      - CONFIG
      - SET
      - maxmemory
      - '0'
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: deployment/valkey-cart
    namespace: default
    what: maxmemory is 256kb with maxmemory-policy noeviction, so every write is rejected
  explanation: Valkey's `maxmemory` was set to 256kb, below the memory it already uses, while `maxmemory-policy`
    is `noeviction`. Reads work; every write fails with `OOM command not allowed when used memory > 'maxmemory'`.
  evidence:
  - 'cart logs: `OOM command not allowed` on writes.'
  - '`kubectl exec deploy/valkey-cart -- valkey-cli INFO memory`: used_memory > maxmemory, policy noeviction.'
  - Raise or remove the cap (or allow eviction).
reference:
  commands:
  - kubectl exec deploy/valkey-cart -- valkey-cli CONFIG SET maxmemory 0
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
notes:
- 256kb is below even an empty instance's footprint, so every write is refused.
