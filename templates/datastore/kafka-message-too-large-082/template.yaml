spec_version: 2
id: kafka-message-too-large-082
version: 1
title: Topic max message size below the size of real messages
mechanism: datastore/queue-message-size-limit
split: train
seed: 1082
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Checkout works, but no new orders reach accounting or fraud detection. Find the cause and fix it.
tags:
  layer: datastore
  symptom: silent-data
  fix_type:
  - datastore-cmd
  drivers:
  - async-path
  - silent-failure
  injector: exec
fault:
  steps:
  - mechanism: runtime.exec
    target: deploy/gym-kafka-tools
    namespace: gym-system
    commands:
    - - /opt/kafka/bin/kafka-configs.sh
      - --bootstrap-server
      - kafka.default.svc.cluster.local:9092
      - --alter
      - --entity-type
      - topics
      - --entity-name
      - orders
      - --add-config
      - max.message.bytes=128
    undo_commands:
    - - /opt/kafka/bin/kafka-configs.sh
      - --bootstrap-server
      - kafka.default.svc.cluster.local:9092
      - --alter
      - --entity-type
      - topics
      - --entity-name
      - orders
      - --delete-config
      - max.message.bytes
  restart_on_revert:
  - deployment/checkout
  - deployment/accounting
  - deployment/fraud-detection
verifier:
  checks:
  - type: orders_recorded
    timeout_s: 60
  - type: journey
    journey: checkout
    repeat: 2
    max_error_pct: 0
    max_avg_ms: 5000
ground_truth:
  root_causes:
  - component: deployment/kafka
    namespace: default
    what: the orders topic has max.message.bytes=128, so the broker rejects every order event
  explanation: The `orders` topic got `max.message.bytes=128`. Every order event is larger, so the broker rejects
    it (`RecordTooLargeException`). Checkout publishes asynchronously and only logs the error, so orders succeed
    while the downstream consumers receive nothing.
  evidence:
  - 'checkout logs: producer errors `The request included a message larger than the max message size`.'
  - Consumer lag is not growing (nothing is produced), which rules out slow consumers.
  - '`kafka-configs.sh --describe --entity-type topics --entity-name orders`: max.message.bytes=128.'
reference:
  commands:
  - kubectl exec -n gym-system deploy/gym-kafka-tools -- /opt/kafka/bin/kafka-configs.sh --bootstrap-server kafka.default.svc.cluster.local:9092
    --alter --entity-type topics --entity-name orders --delete-config max.message.bytes
  agent_commands:
  - 'kubectl exec deploy/kafka -- env KAFKA_HEAP_OPTS=''-Xmx96M -Xms16M'' JAVA_TOOL_OPTIONS= /opt/kafka/bin/kafka-configs.sh --bootstrap-server localhost:9092 --alter --entity-type topics --entity-name orders --delete-config max.message.bytes'
