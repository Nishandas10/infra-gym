spec_version: 2
id: wl-scaled-to-zero-025
version: 1
title: Deployment scaled to zero replicas
mechanism: workload/scaled-to-zero
family: workload
split: train
seed: 1025
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Browsing and the cart work, but 'Place Order' always fails. Find the cause and fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: checkout
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/replicas
      value: 0
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: endpoints
    service: checkout
  root_cause:
  - checkout
reference:
  commands:
  - kubectl scale deployment checkout --replicas=1
  - kubectl rollout status deployment/checkout --timeout=300s
  cause: The checkout Deployment was scaled to 0 replicas (a leftover of a maintenance action), so there is no checkout
    pod at all.
  diagnose:
  - '`kubectl get pods`: no checkout pod.'
  - '`kubectl get deploy checkout`: `0/0` replicas.'
  - '`kubectl logs deploy/frontend`: checkout calls fail (unavailable / no endpoints).'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
