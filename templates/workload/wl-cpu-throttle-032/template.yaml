spec_version: 2
id: wl-cpu-throttle-032
version: 1
title: CPU limit so low the service is throttled into slowness
mechanism: workload/cpu-limit-throttling
split: train
seed: 1032
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The whole shop has become very slow since yesterday, but nothing is failing. Find the cause and fix it.
    ticket: The whole shop has become very slow since yesterday's resource tuning, but nothing is failing and no
      pod is restarting. Find the cause and fix it.
tags:
  layer: workload
  symptom: latency
  fix_type:
  - config-edit
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: frontend
    recreate_pods: false
    ops:
    - op: set
      path: /spec/template/spec/containers/$c/resources/limits/cpu
      value: 20m
verifier:
  checks:
  - type: journey
    journey: home
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 1500
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 1500
ground_truth:
  root_causes:
  - component: deployment/frontend
    namespace: default
    what: a CPU limit of 20m throttles the frontend for most of every scheduling period
  explanation: The frontend got a CPU limit of 20m (2% of a core). The CFS scheduler throttles it for most of every
    100ms period, so each page takes seconds even though nothing errors.
  evidence:
  - Latency is high on every page, errors are low, and there are no restarts.
  - '`kubectl get deploy frontend -o yaml`: `limits.cpu: 20m`.'
  - Container CPU usage is pinned at the limit (Grafana, or kubelet stats); throttling metrics climb.
reference:
  commands:
  - kubectl patch deployment frontend --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/resources/limits/cpu"}]'
  - kubectl rollout status deployment/frontend --timeout=300s
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
