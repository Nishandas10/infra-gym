spec_version: 2
id: wl-jvm-heap-over-limit-031
version: 1
title: Memory limit below the JVM heap the broker is configured to use
mechanism: workload/jvm-heap-exceeds-limit
split: train
seed: 1031
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Finance says no new orders are being recorded, the fraud team sees nothing new, and placing orders has
      become unreliable. Find the cause and fix it.
tags:
  layer: workload
  symptom: silent-data
  fix_type:
  - config-edit
  drivers:
  - async-path
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: kafka
    strategy: Recreate
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/resources/limits/memory
      value: 128Mi
  restart_on_revert:
  - deployment/checkout
  - deployment/accounting
  - deployment/fraud-detection
  revert_hooks:
  - kafka_topic: orders
verifier:
  checks:
  - type: pods_ready
    selector: opentelemetry.io/name=kafka
  - type: pods_stable
    selector: opentelemetry.io/name=kafka
    min_age_s: 300
  - type: orders_recorded
    timeout_s: 60
  durability: []
ground_truth:
  root_causes:
  - component: deployment/kafka
    namespace: default
    what: the memory limit (128Mi) is far below the broker's 400M JVM heap, so it is OOMKilled on every start
  explanation: The Kafka broker's memory limit was cut to 128Mi, but it runs with `KAFKA_HEAP_OPTS=-Xmx400M -Xms400M`.
    The JVM needs far more than the limit, so the broker is OOMKilled on every start and crash-loops. Accounting
    and fraud-detection receive nothing. Checkout's Kafka producer also gets stuck when the broker disappears, so
    orders start timing out, and it has to be restarted after the broker is fixed.
  evidence:
  - '`kubectl get pods`: kafka `CrashLoopBackOff`; `kubectl describe pod` shows `OOMKilled`, exit code 137.'
  - '`kubectl get deploy kafka -o yaml`: limit 128Mi vs `KAFKA_HEAP_OPTS=-Xmx400M -Xms400M`.'
  - 'accounting/fraud-detection logs: broker unavailable; checkout requests time out.'
  - After raising the limit, recreate the `orders` topic if the broker lost it (this demo Kafka has no persistent
    volume) and restart checkout and the consumers.
reference:
  commands:
  - kubectl set resources deployment/kafka -c kafka --limits=memory=700Mi
  - kubectl rollout status deployment/kafka --timeout=300s
  - for i in $(seq 1 24); do kubectl exec -n gym-system deploy/gym-kafka-tools -- /opt/kafka/bin/kafka-topics.sh
    --bootstrap-server kafka.default.svc.cluster.local:9092 --create --if-not-exists --topic orders --partitions
    1 --replication-factor 1 && break; sleep 5; done
  - kubectl rollout restart deployment/checkout deployment/accounting deployment/fraud-detection
  - kubectl rollout status deployment/checkout --timeout=300s
  - kubectl rollout status deployment/accounting --timeout=300s
  - kubectl rollout status deployment/fraud-detection --timeout=300s
validation:
  detect_timeout_s: 300
  recover_timeout_s: 600
notes:
- 'verifier.durability is empty on purpose: restarting the broker after the fix drops its topics and can wedge the
  consumers (see fault.revert_hooks and restart_on_revert), which would fail a correct fix.'
- 'Measured: at 300Mi the JVM runs for minutes (heap pages are only touched as used), at 200Mi it OOMs twice then
  settles, at 150Mi it crash-loops with OOMKilled.'
