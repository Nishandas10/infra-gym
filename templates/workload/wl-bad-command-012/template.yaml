spec_version: 2
id: wl-bad-command-012
version: 1
title: Container command points at a binary that does not exist
mechanism: workload/bad-entrypoint
split: train
seed: 1012
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Every order fails with a shipping error. Find the cause and fix it.
    ticket: Every order fails with a shipping error. The shipping service itself is Running. Find the cause and
      fix it.
tags:
  layer: workload
  symptom: hard-errors
  fix_type:
  - config-edit
  drivers:
  - multi-hop
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: quote
    strategy: Recreate
    ops:
    - op: set
      path: /spec/template/spec/containers/$c/command
      value:
      - /usr/local/bin/quote-server
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=quote
ground_truth:
  root_causes:
  - component: deployment/quote
    namespace: default
    what: the container command is overridden with /usr/local/bin/quote-server, which does not exist in the image
  explanation: The quote Deployment overrides the container command with `/usr/local/bin/quote-server`, which does
    not exist in the image. The container can never start, so shipping cannot get a price quote and checkout fails
    two hops away from the real problem.
  evidence:
  - '`kubectl logs deploy/checkout`: the shipping quote call fails.'
  - '`kubectl logs deploy/shipping`: requests to quote fail.'
  - '`kubectl get pods`: quote is `RunContainerError` / `CrashLoopBackOff`; `kubectl describe` says `exec: "/usr/local/bin/quote-server":
    no such file or directory`.'
  - The Deployment spec has a `command:` override the image does not support.
reference:
  commands:
  - kubectl patch deployment quote --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/command"}]'
  - kubectl rollout status deployment/quote --timeout=300s
