spec_version: 2
id: wl-init-container-stuck-026
version: 1
title: Init container waits for a dependency name that never resolves
mechanism: workload/init-container-blocked
family: workload
split: train
seed: 1026
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The cart has been down since the last deploy. The new cart pod never becomes Ready. Find the cause and
      fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: cart
    strategy: Recreate
    ops:
    - op: replace
      path: /spec/template/spec/initContainers/$name:wait-for-valkey-cart/command
      value:
      - sh
      - -c
      - until nc -z -v -w30 valkey-cart-primary 6379; do echo waiting for valkey-cart; sleep 2; done;
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=cart
  root_cause:
  - cart
reference:
  commands:
  - kubectl rollout undo deployment/cart
  - kubectl rollout status deployment/cart --timeout=300s
  cause: The init container `wait-for-valkey-cart` was changed to wait for `valkey-cart-primary`, a host that does
    not exist. The init container loops forever and the main container never starts.
  diagnose:
  - '`kubectl get pods`: cart is `Init:0/1`.'
  - '`kubectl logs <cart-pod> -c wait-for-valkey-cart`: repeated `waiting for valkey-cart` / name resolution errors.'
  - '`kubectl get deploy cart -o yaml`: the init command uses `valkey-cart-primary`.'
  - '`kubectl rollout history deployment/cart` shows the change; rolling back fixes it.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
