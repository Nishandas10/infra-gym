spec_version: 2
id: fa-healthy-release-117
version: 1
title: 'False alarm: a routine recommendation release fired a replica alert while it rolled out; the release is healthy'
mechanism: false-alarm/healthy-release
split: train
seed: 1117
world: k8s-shop
bench_eligible: true
task:
  kind: false_alarm
  prompts:
    page: 'Alert fired a few minutes ago: the recommendation service had fewer ready pods than desired, and its pod
      was replaced. Find the cause and fix it.'
    ticket: 'Alert fired a few minutes ago: the recommendation service had fewer ready pods than desired, and its pod
      was replaced. Product recommendations show up on the storefront when checked by hand. Find the cause and fix
      it.'
    hinted: 'Alert fired a few minutes ago: the recommendation service had fewer ready pods than desired, and its pod
      was replaced. The recommendation service changed shortly before the alert. Find the cause and fix it.'
  leak_terms: [release, released, rollout, roll out, rolled out, revision, version, deploy, deployed, upgrade,
    dependency, plat-2290]
tags:
  layer: workload
  symptom: none
  fix_type:
  - none
  drivers:
  - recent-change-bias
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.bad_rollout
    target: recommendation
    change_cause: 'recommendation 3.1.1: dependency bumps (PLAT-2290)'
    wait_s: 180
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:OTEL_RESOURCE_ATTRIBUTES/value
      value: service.version=3.1.1,service.criticality=medium
    - op: replace
      path: /spec/template/metadata/labels/app.kubernetes.io~1version
      value: 3.1.1
verifier:
  checks:
  - type: journey
    journey: recommendations
    repeat: 3
  - type: pods_ready
    selector: opentelemetry.io/name=recommendation
  alarm_checks:
  # The pod the release created is younger than 5 minutes: what the replica alert saw.
  - type: pods_stable
    selector: opentelemetry.io/name=recommendation
    min_age_s: 300
ground_truth:
  root_causes:
  - component: deployment/recommendation
    namespace: default
    what: a routine release (3.1.1, dependency bumps) replaced the pod; the alert fired during that rollout and the
      new revision is healthy
  explanation: >-
    Recommendation 3.1.1 was rolled out a few minutes ago (change-cause "dependency bumps (PLAT-2290)"; it only
    changes the version label and the OTel resource attributes). While the single pod was being replaced the
    Deployment briefly had fewer ready replicas than desired, which fired the alert. The new pod is Ready, has not
    restarted, logs normally and serves recommendations. Nothing is broken: rolling the release back, restarting the
    service or any other change is unnecessary.
  evidence:
  - '`kubectl rollout history deployment/recommendation`: the latest revision has the change-cause
    "recommendation 3.1.1: dependency bumps (PLAT-2290)".'
  - '`kubectl get pods -l opentelemetry.io/name=recommendation`: one pod, Running, Ready, 0 restarts, a few
    minutes old.'
  - '`kubectl get events`: ScalingReplicaSet for recommendation; no warnings.'
  - The storefront shows recommendations; recommendation's logs show normal requests.
  red_herrings:
  - The fresh revision with a change-cause invites a rollback, but the release is healthy.
reference:
  commands: []
  agent_commands:
  - kubectl get pods -l opentelemetry.io/name=recommendation
  - kubectl rollout history deployment/recommendation
  - kubectl logs deploy/recommendation --tail=20
  fix: Nothing to fix. Report that the alert fired during a routine, healthy rollout of recommendation 3.1.1. A
    `kubectl rollout undo`, a restart or any other change fails the episode.
notes:
- 'Measured on a dev cluster, 2026-10-17: rollout finished within wait_s; recommendations journey and pods_ready PASS on
  every poll for 7 min; pods_stable(min_age_s=300) FAIL until the new pod was 300 s old; revert restored the original
  ReplicaSet as the current one.'
