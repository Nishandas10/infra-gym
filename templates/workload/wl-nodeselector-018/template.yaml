spec_version: 2
id: wl-nodeselector-018
version: 2
title: nodeSelector matches no node -> Pending
mechanism: workload/unschedulable-node-selector
split: train
seed: 1018
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The advertisement banner has disappeared from the shop. Find the cause and fix it.
tags:
  layer: workload
  symptom: hard-errors
  fix_type:
  - config-edit
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: ad
    strategy: Recreate
    ops:
    - op: set
      path: /spec/template/spec/nodeSelector
      value:
        disktype: ssd
verifier:
  checks:
  - type: journey
    journey: ads
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=ad
ground_truth:
  root_causes:
  - component: deployment/ad
    namespace: default
    what: nodeSelector disktype=ssd matches no node, so the pod stays Pending
  explanation: 'The ad Deployment was given `nodeSelector: disktype=ssd`. No node carries that label, so the scheduler
    cannot place the pod.'
  evidence:
  - '`kubectl get pods`: ad is `Pending`.'
  - '`kubectl describe pod -l opentelemetry.io/name=ad`: `didn''t match Pod''s node affinity/selector`.'
  - '`kubectl get nodes --show-labels`: no node has `disktype=ssd`.'
reference:
  commands:
  - kubectl patch deployment ad --type=json -p '[{"op":"remove","path":"/spec/template/spec/nodeSelector"}]'
  - kubectl rollout status deployment/ad --timeout=300s
validation:
  recover_timeout_s: 600
notes:
- 'v2 (2026-10-14): recover_timeout_s 600 (default 300). After a long hold the restarted ad JVM once stalled near its
  memory limit without listening (ad has no readiness probe, so the pod still counted Ready), was OOM-killed after
  about 6 minutes and then served normally. One such restart cycle is part of the world, not of this fault, so the
  recovery window covers it.'
