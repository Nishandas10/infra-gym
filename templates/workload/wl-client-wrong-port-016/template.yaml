spec_version: 2
id: wl-client-wrong-port-016
version: 1
title: Client configured with the wrong port for a dependency
mechanism: workload/client-dependency-port
family: workload
split: train
seed: 1016
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Browsing and the cart work, but placing an order always fails. Find the cause and fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: checkout
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:PRODUCT_CATALOG_ADDR/value
      value: product-catalog:9090
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  root_cause:
  - checkout
reference:
  commands:
  - kubectl set env deployment/checkout PRODUCT_CATALOG_ADDR=product-catalog:8080
  - kubectl rollout status deployment/checkout --timeout=300s
  cause: Checkout's `PRODUCT_CATALOG_ADDR` uses port 9090. The product-catalog Service only exposes 8080, so checkout
    cannot look up product prices. Browsing still works because the frontend uses the right address.
  diagnose:
  - '`kubectl logs deploy/checkout`: `connection refused` / unavailable for product-catalog.'
  - The frontend can reach product-catalog, so the catalog itself is healthy.
  - '`kubectl get deploy checkout -o yaml` vs `kubectl get svc product-catalog`: port mismatch 9090 vs 8080.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
