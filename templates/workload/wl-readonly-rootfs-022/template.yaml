spec_version: 2
id: wl-readonly-rootfs-022
version: 1
title: readOnlyRootFilesystem on a server that writes to disk -> crash
mechanism: workload/read-only-root-filesystem
split: train
seed: 1022
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: All product images in the shop are broken, although the pages themselves load. Find the cause and fix
      it.
tags:
  layer: workload
  symptom: hard-errors
  fix_type:
  - config-edit
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: image-provider
    strategy: Recreate
    ops:
    - op: set
      path: /spec/template/spec/containers/$c/securityContext/readOnlyRootFilesystem
      value: true
verifier:
  checks:
  - type: journey
    journey: images
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=image-provider
ground_truth:
  root_causes:
  - component: deployment/image-provider
    namespace: default
    what: readOnlyRootFilesystem is set, but nginx must write under /run and /var/cache/nginx, so it exits at startup
  explanation: image-provider (nginx) was given a read-only root filesystem, but nginx must write its pid file and
    cache under `/run` and `/var/cache/nginx`. It exits at startup.
  evidence:
  - '`kubectl get pods`: image-provider is in `CrashLoopBackOff`.'
  - '`kubectl logs deploy/image-provider --previous`: `Read-only file system` errors.'
  - '`kubectl get deploy image-provider -o yaml`: `readOnlyRootFilesystem: true`.'
reference:
  commands:
  - kubectl patch deployment image-provider --type=json -p '[{"op":"remove","path":"/spec/template/spec/containers/0/securityContext/readOnlyRootFilesystem"}]'
  - kubectl rollout status deployment/image-provider --timeout=300s
