spec_version: 2
id: pod-failure-055
version: 1
title: Pod stays 'Running' but its process has been replaced by a pause container
mechanism: chaos/pod-failure
split: train
seed: 1055
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Every order fails at the shipping step. Find the cause and fix it.
    ticket: Orders fail at shipping. `kubectl get pods` claims shipping is Running. Find the cause and fix it.
tags:
  layer: workload
  symptom: hard-errors
  fix_type:
  - delete-object
  drivers:
  - looks-healthy
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: PodChaos
      metadata:
        name: shipping-pod-failure
        namespace: default
      spec:
        action: pod-failure
        mode: all
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: shipping
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: podchaos/shipping-pod-failure
    namespace: default
    what: a PodChaos pod-failure experiment swapped the shipping container's image for a pause image
  explanation: A PodChaos `pod-failure` experiment swapped the shipping container's image for a `pause` image, so
    the pod exists and looks alive but nothing is serving.
  evidence:
  - '`kubectl get pods`: shipping Running, but connections to it fail.'
  - '`kubectl get pod -l opentelemetry.io/name=shipping -o jsonpath=''{.items[0].spec.containers[0].image}''`: a
    pause image, not the shipping image.'
  - '`kubectl get podchaos -A`: `shipping-pod-failure`.'
reference:
  commands:
  - kubectl delete podchaos.chaos-mesh.org shipping-pod-failure
