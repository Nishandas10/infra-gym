spec_version: 2
id: wl-crash-invalid-env-013
version: 1
title: Invalid configuration value makes the service crash at startup
mechanism: workload/invalid-config-crash
family: workload
split: train
seed: 1013
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Since the last configuration change every order fails at the shipping step. Find the cause and fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: shipping
    strategy: Recreate
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:SHIPPING_PORT/value
      value: eighty-eighty
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=shipping
  root_cause:
  - shipping
reference:
  commands:
  - kubectl set env deployment/shipping SHIPPING_PORT=8080
  - kubectl rollout status deployment/shipping --timeout=300s
  cause: '`SHIPPING_PORT` was set to `eighty-eighty`. The shipping service cannot parse it into a listen address
    and exits at startup, so it crash-loops.'
  diagnose:
  - '`kubectl get pods`: shipping is in `CrashLoopBackOff`.'
  - '`kubectl logs deploy/shipping --previous`: startup error about the port / bind address.'
  - '`kubectl get deploy shipping -o yaml`: `SHIPPING_PORT` has an invalid value.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
