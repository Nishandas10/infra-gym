spec_version: 2
id: node-cordoned-045
version: 1
title: All worker nodes cordoned; a pod cannot be rescheduled
mechanism: platform/nodes-cordoned
split: train
seed: 1045
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The cart went down a while ago and never came back; adding to cart and ordering fail. Find the cause and
      fix it.
    ticket: The cart went down after its pod was evicted during node maintenance, and it never came back. Find the
      cause and fix it.
tags:
  layer: node
  symptom: hard-errors
  fix_type:
  - node-op
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.object_patch
    kind: node
    name: $workers
    namespace: null
    ops:
    - op: set
      path: /spec/unschedulable
      value: true
    recreate_pods_after:
    - opentelemetry.io/name=cart
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: pods_ready
    selector: opentelemetry.io/name=cart
ground_truth:
  root_causes:
  - component: node/$workers
    namespace: null
    what: every worker node is cordoned, so the cart pod cannot be scheduled
  explanation: All worker nodes were cordoned for maintenance and never uncordoned. When the cart pod was removed,
    its replacement had nowhere to be scheduled (the control-plane node is tainted).
  evidence:
  - '`kubectl get pods`: cart `Pending`.'
  - '`kubectl describe pod -l opentelemetry.io/name=cart`: `node(s) were unschedulable`.'
  - '`kubectl get nodes`: every worker `SchedulingDisabled`.'
reference:
  commands:
  - kubectl uncordon -l '!node-role.kubernetes.io/control-plane'
  - kubectl rollout status deployment/cart --timeout=300s
