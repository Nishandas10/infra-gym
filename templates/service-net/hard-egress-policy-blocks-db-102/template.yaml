spec_version: 2
id: hard-egress-policy-blocks-db-102
version: 1
title: A security-hardening egress policy forgets the database port; everything points at the database
mechanism: hard/egress-allowlist-omits-dependency-port
split: hard
seed: 1102
world: k8s-shop
bench_eligible: true
tools:
- kubectl
- curl
task:
  kind: incident
  prompts:
    page: Product pages and the product list have been failing for about ten minutes. Alerts show database connection
      errors. Find the cause and fix it.
    hinted: Product pages fail with database connection timeouts, but the database itself is up and accepting connections.
      A security hardening change went out today. Find the cause and fix it.
tags:
  layer: service-net
  symptom: hard-errors
  fix_type:
  - config-edit
  - restart
  drivers:
  - red-herring
  - misattributed-symptom
  - network-path
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.create_objects
    noise: true
    manifests:
    - apiVersion: batch/v1
      kind: Job
      metadata:
        name: astronomy-db-backup-nightly
        namespace: default
        labels: &id001
          app: astronomy-db-backup-nightly
          team: data-platform
      spec:
        backoffLimit: 0
        template:
          metadata:
            labels: *id001
          spec:
            restartPolicy: Never
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sh
              - -c
              - 'echo "pg_dump: error: connection to server at "astronomy-db" port 5432 failed: FATAL:  password
                authentication failed for user "backup"" >&2; exit 1'
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                requests:
                  memory: 8Mi
                  cpu: 5m
    - apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: catalog-search-indexer
        namespace: default
        labels: &id002
          app: catalog-search-indexer
          team: search
      spec:
        replicas: 1
        selector:
          matchLabels:
            app: catalog-search-indexer
        template:
          metadata:
            labels: *id002
          spec:
            containers:
            - name: main
              image: busybox:1.36
              command:
              - sh
              - -c
              - 'echo "ERROR indexer: could not connect to astronomy-db:5432 (timeout after 5s); search index is
                stale" >&2; sleep 5; exit 1'
              resources:
                limits:
                  memory: 16Mi
                  cpu: 50m
                requests:
                  memory: 8Mi
                  cpu: 5m
  - mechanism: k8s.create_objects
    recreate_pods_after:
    - opentelemetry.io/name=product-catalog
    manifests:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: product-catalog-egress-hardening
        namespace: default
        labels:
          security.example.com/ticket: SEC-2291
        annotations:
          security.example.com/summary: Restrict product-catalog egress to known service ports
      spec:
        podSelector:
          matchLabels:
            opentelemetry.io/name: product-catalog
        policyTypes:
        - Egress
        egress:
        - to:
          - namespaceSelector:
              matchLabels:
                kubernetes.io/metadata.name: kube-system
          ports:
          - protocol: UDP
            port: 53
          - protocol: TCP
            port: 53
        - ports:
          - protocol: TCP
            port: 8080
          - protocol: TCP
            port: 4317
          - protocol: TCP
            port: 4318
          - protocol: TCP
            port: 8013
          - protocol: TCP
            port: 8016
          - protocol: TCP
            port: 443
  restart_on_revert:
  - deployment/product-catalog
verifier:
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: networkpolicy/product-catalog-egress-hardening
    namespace: default
    what: the egress allow-list omits PostgreSQL (5432), so product-catalog cannot reach astronomy-db
  explanation: NetworkPolicy product-catalog-egress-hardening allows egress only to DNS and a list of service ports
    that omits PostgreSQL (5432), so product-catalog cannot reach astronomy-db. The database is healthy; the failed
    backup job and the crash-looping search indexer are unrelated noise.
  evidence:
  - 'product-catalog logs (or crash loop): timeouts connecting to astronomy-db:5432.'
  - 'astronomy-db itself is healthy: `kubectl exec deploy/astronomy-db -- psql -U postgres -c ''select 1''` works,
    and connections from other pods succeed. So the path, not the database, is broken.'
  - A timeout (not 'connection refused' or an auth error) from one client suggests filtering.
  - '`kubectl get networkpolicy` shows product-catalog-egress-hardening; its egress ports omit 5432.'
  - Add 5432 to the policy (or remove the policy), then restart product-catalog.
  red_herrings:
  - failed backup Job with a password error
  - crash-looping search indexer logging DB timeouts
reference:
  commands:
  - kubectl patch networkpolicy product-catalog-egress-hardening --type=json -p '[{"op":"add","path":"/spec/egress/1/ports/-","value":{"protocol":"TCP","port":5432}}]'
  - kubectl rollout restart deployment/product-catalog
  - kubectl rollout status deployment/product-catalog --timeout=300s
  traps:
  - Chasing the backup job's password error or the indexer's timeouts (other teams, unrelated).
  - Restarting or reconfiguring the database (changes nothing).
  - Deleting other teams' workloads to 'clean up' (counts as a distractor touch).
validation:
