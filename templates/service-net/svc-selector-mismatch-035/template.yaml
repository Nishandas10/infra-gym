spec_version: 2
id: svc-selector-mismatch-035
version: 1
title: Service selector matches no pods -> no endpoints
mechanism: service/selector-mismatch
split: train
seed: 1035
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Product pages, recommendations and checkout all fail. Find the cause and fix it.
    ticket: Product pages, recommendations and checkout all fail. The product-catalog pod is Running and Ready.
      Find the cause and fix it.
tags:
  layer: service-net
  symptom: hard-errors
  fix_type:
  - config-edit
  drivers:
  - looks-healthy
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.object_patch
    kind: service
    name: product-catalog
    restart_after:
    - deployment/product-catalog
    ops:
    - op: replace
      path: /spec/selector
      value:
        opentelemetry.io/name: product-catalog-v2
verifier:
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: endpoints
    service: product-catalog
ground_truth:
  root_causes:
  - component: service/product-catalog
    namespace: default
    what: the selector was changed to product-catalog-v2, which no pod carries, so the Service has no endpoints
  explanation: The `product-catalog` Service selector was changed to `opentelemetry.io/name=product-catalog-v2`,
    which no pod carries, so the Service has no endpoints.
  evidence:
  - '`kubectl get endpointslices -l kubernetes.io/service-name=product-catalog`: no endpoints.'
  - '`kubectl get svc product-catalog -o yaml`: selector `product-catalog-v2`.'
  - '`kubectl get pods --show-labels`: the pod is labelled `product-catalog`.'
reference:
  commands:
  - kubectl patch service product-catalog --type=json -p '[{"op":"replace","path":"/spec/selector","value":{"opentelemetry.io/name":"product-catalog"}}]'
