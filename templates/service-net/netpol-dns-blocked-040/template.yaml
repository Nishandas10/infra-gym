spec_version: 2
id: netpol-dns-blocked-040
version: 1
title: Egress policy allows app ports but blocks DNS
mechanism: network-policy/dns-egress-blocked
split: train
seed: 1040
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Every API call from the shop's web frontend fails. Find the cause and fix it.
    ticket: Every API call from the shop fails after a network-policy change, even though all backends are healthy
      and port 8080 is explicitly allowed. Find the cause and fix it.
tags:
  layer: service-net
  symptom: hard-errors
  fix_type:
  - delete-object
  - restart
  drivers:
  - looks-correct-config
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.create_objects
    recreate_pods_after:
    - opentelemetry.io/name=frontend
    manifests:
    - apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: frontend-egress-app-ports
        namespace: default
      spec:
        podSelector:
          matchLabels:
            opentelemetry.io/name: frontend
        policyTypes:
        - Egress
        egress:
        - ports:
          - protocol: TCP
            port: 8080
verifier:
  checks:
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: networkpolicy/frontend-egress-app-ports
    namespace: default
    what: the frontend's egress policy allows only TCP 8080, which blocks DNS
  explanation: The egress policy on the frontend allows TCP 8080 to anywhere but nothing else, so DNS (UDP/TCP 53)
    is blocked. The frontend cannot resolve any service name, so the allowed port never gets used.
  evidence:
  - '`kubectl logs deploy/frontend`: name resolution errors (EAI_AGAIN / getaddrinfo).'
  - '`kubectl get networkpolicy frontend-egress-app-ports -o yaml`: only TCP 8080 is allowed; no rule for port 53.'
  - Add a DNS rule or remove the policy.
reference:
  commands:
  - kubectl delete networkpolicy frontend-egress-app-ports
  - kubectl rollout restart deployment/frontend
  - kubectl rollout status deployment/frontend --timeout=300s
