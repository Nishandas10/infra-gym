spec_version: 2
id: svc-deleted-037
version: 1
title: Service object deleted
mechanism: service/deleted
split: train
seed: 1037
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Customers stopped receiving order confirmation emails today. Orders go through. Find the cause and fix
      it.
tags:
  layer: service-net
  symptom: silent-data
  fix_type:
  - restore-object
  drivers:
  - silent-failure
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.delete_object
    kind: service
    name: email
verifier:
  checks:
  - type: journey
    journey: email
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: endpoints
    service: email
ground_truth:
  root_causes:
  - component: service/email
    namespace: default
    what: the email Service was deleted, so the name email no longer resolves
  explanation: The `email` Service was deleted, so the name `email` no longer resolves. Checkout only logs the failed
    send, so orders keep succeeding. Helm still has the Service in its release, so re-syncing the release recreates
    it.
  evidence:
  - '`kubectl logs deploy/checkout`: `lookup email ... no such host` when sending confirmations.'
  - '`kubectl get svc email`: NotFound, while the email pod is Running.'
  - Recreate it from the source of truth (`helm upgrade` via `scripts/reset_world.sh`), not by hand, so Helm keeps
    ownership.
reference:
  commands:
  - bash scripts/reset_world.sh
  agent_commands:
  - 'kubectl expose deployment email --name=email --port=8080 --target-port=8080'
validation:
  recover_timeout_s: 480
