spec_version: 2
id: hard-mutating-policy-rewrites-pods-131
version: 2
title: Checkout calls the wrong payment port although its Deployment is correct
mechanism: hard/mutating-admission-policy-rewrites-pods
split: hard
seed: 1131
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Every checkout fails since the checkout pods were replaced during routine maintenance a few minutes ago.
      Find the cause and fix it.
    hinted: The checkout pods do not run with the configuration their Deployment declares. Find what changes them and
      fix it.
tags:
  layer: platform
  symptom: hard-errors
  fix_type:
  - delete-object
  - restart
  drivers:
  - looks-correct-config
  - hidden-second-actor
  - fix-is-blocked
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.create_objects
    manifests:
    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicy
      metadata:
        name: platform-pod-defaults
        namespace: null
      spec:
        matchConstraints:
          resourceRules:
          - apiGroups: ['']
            apiVersions: [v1]
            operations: [CREATE]
            resources: [pods]
        matchConditions:
        - name: checkout-pods
          expression: has(object.metadata.labels) && object.metadata.labels.exists(k, k == 'opentelemetry.io/name')
            && object.metadata.labels['opentelemetry.io/name'] == 'checkout'
        failurePolicy: Fail
        reinvocationPolicy: Never
        mutations:
        - patchType: ApplyConfiguration
          applyConfiguration:
            expression: 'Object{spec: Object.spec{containers: [Object.spec.containers{name: "checkout", env: [Object.spec.containers.env{name:
              "PAYMENT_ADDR", value: "payment:8081"}]}]}}'
    - apiVersion: admissionregistration.k8s.io/v1
      kind: MutatingAdmissionPolicyBinding
      metadata:
        name: platform-pod-defaults
        namespace: null
      spec:
        policyName: platform-pod-defaults
        matchResources:
          namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: default
    # the API server takes a few seconds to start applying a new policy: replace the pods only then (no new
    # Deployment revision, so the rollout history stays clean)
    settle_s: 20
    recreate_pods_after:
    - opentelemetry.io/name=checkout
  # Revert: the checkout pods the policy rewrote keep payment:8081 after it is deleted. Replace them once the deleted
  # policy has stopped acting (v1 left checkout broken for the next episode whenever the agent had not fixed it).
  revert_hooks:
  - sleep_s: 20
  restart_on_revert:
  - opentelemetry.io/name=checkout
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
ground_truth:
  root_causes:
  - component: mutatingadmissionpolicy/platform-pod-defaults
    namespace: default
    what: a cluster-wide MutatingAdmissionPolicy (bound to the default namespace) rewrites PAYMENT_ADDR to payment:8081
      on every new checkout pod
  explanation: A MutatingAdmissionPolicy named platform-pod-defaults (with a binding of the same name) changes every
    checkout pod at creation, setting PAYMENT_ADDR to payment:8081. The payment Service listens on 8080, so every
    checkout fails. The checkout Deployment, its ReplicaSet and its rollout history are all correct; only the running
    pods differ. Patching the Deployment or restarting checkout changes nothing, because each new pod is rewritten
    again. The policy is cluster-scoped.
  evidence:
  - 'checkout logs: payment calls fail with connection refused on payment:8081.'
  - '`kubectl get deploy checkout -o yaml` shows PAYMENT_ADDR=payment:8080; `kubectl get pod <checkout pod> -o yaml`
    shows payment:8081.'
  - '`kubectl get mutatingadmissionpolicies,mutatingadmissionpolicybindings` lists platform-pod-defaults, which
    targets checkout pods.'
  red_herrings:
  - 'The payment Service and pods are healthy; port 8080 works from any other client.'
reference:
  commands:
  - kubectl delete mutatingadmissionpolicybinding platform-pod-defaults
  - kubectl delete mutatingadmissionpolicy platform-pod-defaults
  - sleep 15
  - kubectl rollout restart deployment/checkout
  - kubectl rollout status deployment/checkout --timeout=300s
  fix: Delete the MutatingAdmissionPolicy platform-pod-defaults and its binding, wait a few seconds for the API server
    to drop it, then restart checkout so its pods are created with the Deployment's configuration.
  traps:
  - 'Setting PAYMENT_ADDR on the Deployment again, or restarting checkout: each new pod is rewritten.'
  - 'Restarting checkout right after deleting the policy: the API server can still apply it for a few seconds;
    check the new pod''s env and restart again if needed.'
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 60
  baseline_timeout_s: 180
budget:
  max_steps: 40
  wall_s: 1200
meta:
  tier: hard
  layers: 1
  realistic_pattern: A platform-wide pod-defaults policy that silently overrides an application's own configuration
  built_from:
  - new use of k8s.create_objects with a cluster-scoped MutatingAdmissionPolicy
notes:
- 'Spikes h2/h2b (2026-10-19, 2nd cluster): checkout failed steadily for 10 min (504 timeouts, then 500s) while the
  Deployment showed payment:8080 and the pods payment:8081. Deleting the policy and restarting checkout at once did
  NOT recover: a pod created 2 s after the delete was still mutated (admission policy cache), and nothing created a
  new pod after it. Deleting, waiting 15 s, then restarting recovered (checkout 3/3 about 3 min later). The agent may
  get, list and delete mutating admission policies and bindings, not create or change them (bench/sandbox_up.sh).'
- 'Validation (2026-10-19): one of 5 runs SELF_HEALED: the pods were replaced within a second of creating the policy,
  before the API server applied it, so they came up correct. The injection now waits 20 s (settle_s) before deleting
  the checkout pods.'
- 'v2 (2026-10-19): calibration found the world broken after episodes the agent did not fix (DeepSeek attempt 1, the
  diagnose/detect oracle): v1''s revert deleted the policy but left the rewritten checkout pods running. The revert
  now waits 20 s and then replaces them (revert_hooks sleep_s + restart_on_revert).'
