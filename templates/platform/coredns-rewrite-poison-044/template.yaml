spec_version: 2
id: coredns-rewrite-poison-044
version: 1
title: CoreDNS rewrite rule sends one service's name to another
mechanism: platform/cluster-dns-rewrite
family: platform
split: train
seed: 1044
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Payments fail with protocol errors, as if checkout were talking to the wrong service. The payment pod
      is healthy. Find the cause and fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.configmap_edit
    namespace: kube-system
    name: coredns
    key: Corefile
    replace:
    - - |2
            ready
      - |2
            ready
            rewrite name payment.default.svc.cluster.local shipping.default.svc.cluster.local
    restart_after:
    - deployment/coredns
    recreate_pods_after:
    - opentelemetry.io/name=checkout
    settle_s: 25
  restart_on_revert:
  - deployment/checkout
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  root_cause:
  - coredns
reference:
  commands:
  - kubectl -n kube-system get configmap coredns -o yaml | sed '/rewrite name payment.default/d' | kubectl apply
    -f -
  - kubectl -n kube-system rollout restart deployment/coredns
  - kubectl -n kube-system rollout status deployment/coredns --timeout=300s
  - kubectl rollout restart deployment/checkout
  - kubectl rollout status deployment/checkout --timeout=300s
  cause: Someone added `rewrite name payment.default.svc.cluster.local shipping.default.svc.cluster.local` to the
    CoreDNS Corefile. Lookups of `payment` return the shipping Service's IP, so checkout's gRPC calls reach an HTTP
    server and fail.
  diagnose:
  - '`kubectl logs deploy/checkout`: protocol / unavailable errors calling payment.'
  - '`kubectl run -it --rm dnstest --image=busybox --restart=Never -- nslookup payment`: returns the IP of the `shipping`
    Service (compare `kubectl get svc`).'
  - '`kubectl -n kube-system get configmap coredns -o yaml`: the rewrite rule.'
validation:
  detect_timeout_s: 300
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
