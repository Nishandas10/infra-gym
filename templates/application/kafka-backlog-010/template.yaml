spec_version: 2
id: kafka-backlog-010
version: 1
title: Kafka flooded and consumers slowed (kafkaQueueProblems)
mechanism: app-flag/kafka-queue-overload
family: application
split: train
seed: 1010
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Checkout works and customers get order confirmations, but the fraud team says new orders reach their system
      minutes late or not at all. Investigate and fix it.
tags:
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: kafkaQueueProblems
    variant: 'on'
verifier:
  checks:
  - type: kafka_lag
    group: fraud-detection
    max_lag: 50
  - type: journey
    journey: checkout
    repeat: 2
    max_error_pct: 0
    max_avg_ms: 5000
  root_cause:
  - kafka
  - checkout
  - fraud-detection
  forbidden:
  - delete_namespace
  - disable_alerts
  - scale_to_zero
  - edit_verifier
reference:
  commands:
  - python injectors/toggle_flag.py kafkaQueueProblems --off
validation:
  detect_timeout_s: 600
  recover_timeout_s: 900
  hold_s: 60
  poll_s: 15
budget:
  max_steps: 40
  wall_s: 1800
meta:
  golden: true
