spec_version: 2
id: flag-ad-failure-064
version: 1
title: Ad service fails every request (feature flag adFailure)
mechanism: app-flag/ad-failure
family: application
split: train
seed: 1064
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The ad banner is missing on some page views, and the frontend logs occasional errors from the ad service.
      Find the cause and fix it.
tags:
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: adFailure
    variant: 'on'
verifier:
  checks:
  - type: journey
    journey: ads
    repeat: 30
    max_error_pct: 0
    max_avg_ms: 2500
  root_cause:
  - ad
reference:
  commands:
  - python injectors/toggle_flag.py adFailure --off
  cause: The `adFailure` feature flag is on, so the ad service fails about one in ten GetAds calls on purpose. The
    failure is intermittent, so small samples often look healthy.
  diagnose:
  - 'ad logs: errors on some GetAds calls; frontend `/api/data` returns 500 now and then.'
  - Error rate over many requests is ~10%, not 100%.
  - Nothing restarted and nothing was deployed.
  - 'Feature Flags UI: `adFailure` is on.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
notes:
- 'adFailure fails ~1 in 10 requests: 30 probes catch it ~96% of the time.'
