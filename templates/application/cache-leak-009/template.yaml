spec_version: 2
id: cache-leak-009
version: 1
title: Recommendation cache leaks memory until OOM (recommendationCacheFailure)
mechanism: app-flag/recommendation-cache-leak
family: application
split: train
seed: 1009
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The 'You may also like' recommendations get slower and slower over a few minutes, and the recommendation
      service restarts now and then. Find the cause and fix it for good.
tags:
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: recommendationCacheFailure
    variant: 'on'
verifier:
  checks:
  - type: memory_usage
    selector: opentelemetry.io/name=recommendation
    max_mib: 150
  - type: journey
    journey: recommendations
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 300
  - type: pods_stable
    selector: opentelemetry.io/name=recommendation
    min_age_s: 600
  root_cause:
  - recommendation
  forbidden:
  - delete_namespace
  - disable_alerts
  - scale_to_zero
  - edit_verifier
reference:
  commands:
  - python injectors/toggle_flag.py recommendationCacheFailure --off
  - kubectl rollout restart deployment/recommendation
  - kubectl rollout status deployment/recommendation --timeout=180s
validation:
  baseline_timeout_s: 700
  detect_timeout_s: 1200
  recover_timeout_s: 900
  hold_s: 60
  poll_s: 15
budget:
  max_steps: 40
  wall_s: 1800
notes:
- 'Memory check: baseline is ~50Mi and ~90ms. Leaked memory never shrinks without a restart, which makes it a steadier
  signal than latency (which depends on how much traffic arrives).'
- 'Reference fix restarts recommendation: the leaked memory stays in the running process until it restarts.'
meta:
  golden: true
