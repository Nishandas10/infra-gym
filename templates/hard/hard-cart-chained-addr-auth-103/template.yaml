spec_version: 2
id: hard-cart-chained-addr-auth-103
version: 1
title: A mistyped cart datastore port hides a half-finished credential rotation behind it
mechanism: hard/chained-config-then-credential
family: hard
split: hard
seed: 1103
world: k8s-shop
bench_eligible: true
tools:
- kubectl
- curl
task:
  kind: incident
  prompts:
    page: Adding items to the cart fails for every customer since this morning's change window. Find the cause and
      fix it.
    hinted: 'Adding items to the cart fails. Two changes went out this morning: a cart config change and a credential
      rotation for its datastore. Find the cause and fix it.'
tags:
  injector: mixed
  drivers:
  - sequential-layers
  - fix-reveals-next-fault
fault:
  steps:
  - mechanism: runtime.exec
    target: deploy/valkey-cart
    commands:
    - - valkey-cli
      - CONFIG
      - SET
      - requirepass
      - rotated-Xk92-2026
    undo_commands:
    - - sh
      - -c
      - valkey-cli -a rotated-Xk92-2026 --no-auth-warning CONFIG SET requirepass '' || valkey-cli CONFIG SET requirepass
        ''
  - mechanism: k8s.create_objects
    manifests:
    - apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: valkey-cart-credentials
        namespace: default
        annotations:
          rotation.example.com/rotated-at: '2026-10-08T06:00:00Z'
          rotation.example.com/consumers: cart
      stringData:
        password: rotated-Xk92-2026
  - mechanism: k8s.workload_patch
    target: cart
    recreate_pods: true
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/env/$name:VALKEY_ADDR/value
      value: valkey-cart:6380
  restart_on_revert:
  - deployment/cart
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  root_cause:
  - chained-config-then-credential
reference:
  commands:
  - kubectl set env deployment/cart VALKEY_ADDR=valkey-cart:6379
  - kubectl exec deploy/valkey-cart -- valkey-cli -a "$(kubectl get secret valkey-cart-credentials -o jsonpath='{.data.password}'
    | base64 -d)" --no-auth-warning CONFIG SET requirepass ''
  - kubectl rollout restart deployment/cart
  - kubectl rollout status deployment/cart --timeout=300s
  cause: Two layers. (1) cart's VALKEY_ADDR points at port 6380 (connection refused). (2) valkey-cart now requires
    a password (rotated this morning, stored in Secret valkey-cart-credentials) that cart was never given. Fixing
    the port alone turns 'connection refused' into NOAUTH errors.
  diagnose:
  - 'cart logs: connection refused to valkey-cart:6380; the Service and valkey listen on 6379.'
  - Fix VALKEY_ADDR; cart now fails with NOAUTH / authentication required.
  - '`kubectl get secrets` shows valkey-cart-credentials, annotated as rotated this morning for consumer ''cart''.'
  - Either roll the rotation back (clear requirepass using the stored password) or give cart the password; restart
    cart so it reconnects.
  traps:
  - Declaring victory after the port fix without re-testing (the second layer is still there).
  - 'Restarting valkey-cart to drop the password: it works but throws away every customer''s cart.'
validation:
  detect_timeout_s: 300
  recover_timeout_s: 420
  hold_s: 60
  poll_s: 10
  baseline_timeout_s: 180
budget:
  max_steps: 40
  wall_s: 1200
notes:
- 'recreate_pods: old cart pods hold connections authenticated before the rotation and would keep working; replacing
  them makes every cart connection new (as 076 does with a restart).'
meta:
  tier: hard
  layers: 3
  realistic_pattern: Credential rotation applied to the server but not the client, masked by an unrelated typo
  built_from:
  - valkey-requirepass-076
  - wl-paused-rollout-trap-030
