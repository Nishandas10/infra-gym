spec_version: 2
id: net-partition-054
version: 1
title: Network partition between two specific services
mechanism: chaos/network-partition
split: train
seed: 1054
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Orders hang and then fail at the payment step. Find the cause and fix it.
    ticket: Orders hang and then fail at payment. Payment answers requests from everywhere else. Find the cause
      and fix it.
tags:
  layer: network
  symptom: hard-errors
  fix_type:
  - delete-object
  drivers:
  - partial-reachability
  - network-path
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: NetworkChaos
      metadata:
        name: checkout-payment-partition
        namespace: default
      spec:
        action: partition
        mode: all
        direction: both
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: checkout
        target:
          mode: all
          selector:
            namespaces:
            - default
            labelSelectors:
              opentelemetry.io/name: payment
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: networkchaos/checkout-payment-partition
    namespace: default
    what: a NetworkChaos experiment partitions checkout from payment in both directions
  explanation: A NetworkChaos partition drops all traffic between the checkout and payment pods, in both directions.
    Each side can still talk to everything else.
  evidence:
  - 'checkout logs: payment calls time out.'
  - A test call to payment from another pod succeeds, so the problem is specific to the checkout-payment path.
  - '`kubectl get networkchaos -A`: `checkout-payment-partition`.'
reference:
  commands:
  - kubectl delete networkchaos.chaos-mesh.org checkout-payment-partition
