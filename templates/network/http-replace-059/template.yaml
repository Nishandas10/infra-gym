spec_version: 2
id: http-replace-059
version: 1
title: HTTP responses from a service replaced with garbage
mechanism: chaos/http-response-corruption
split: train
seed: 1059
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Every order fails at the shipping step. Find the cause and fix it.
    ticket: Orders fail at the shipping step with parse errors, yet the quote service returns HTTP 200. Find the
      cause and fix it.
tags:
  layer: network
  symptom: hard-errors
  fix_type:
  - delete-object
  drivers:
  - misattributed-symptom
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: HTTPChaos
      metadata:
        name: quote-http-garbage
        namespace: default
      spec:
        mode: all
        target: Response
        port: 8080
        path: '*'
        replace:
          body: bm90LWEtbnVtYmVy
          code: 200
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: quote
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: httpchaos/quote-http-garbage
    namespace: default
    what: an HTTPChaos experiment replaces every quote response with the body 'not-a-number' (status 200)
  explanation: An HTTPChaos experiment rewrites every response from the quote service to the body `not-a-number`
    with status 200. Shipping cannot parse the quote, so checkout fails, though every HTTP status is OK.
  evidence:
  - 'shipping logs: failed to parse the quote response.'
  - Calling quote directly from a debug pod returns `not-a-number` instead of a price.
  - '`kubectl get httpchaos -A`: `quote-http-garbage`.'
reference:
  commands:
  - kubectl delete httpchaos.chaos-mesh.org quote-http-garbage
