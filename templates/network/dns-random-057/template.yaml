spec_version: 2
id: dns-random-057
version: 1
title: DNS returns random addresses for one name
mechanism: chaos/dns-wrong-answers
split: train
seed: 1057
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Product recommendations ('You may also like') stopped working; product pages themselves load fine. Find
      the cause and fix it.
    ticket: Recommendations have failed since the product-catalog pod was rescheduled; the catalog itself serves
      product pages fine. Find the cause and fix it.
tags:
  layer: network
  symptom: hard-errors
  fix_type:
  - delete-object
  drivers:
  - looks-healthy
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    kill_pods_after:
    - opentelemetry.io/name=product-catalog
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: DNSChaos
      metadata:
        name: catalog-dns-random
        namespace: default
      spec:
        action: random
        mode: all
        patterns:
        - product-catalog
        - product-catalog.*
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: recommendation
verifier:
  checks:
  - type: journey
    journey: recommendations
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
    timeout_s: 6
ground_truth:
  root_causes:
  - component: dnschaos/catalog-dns-random
    namespace: default
    what: a DNSChaos experiment returns random IP addresses for product-catalog to the recommendation service
  explanation: A DNSChaos experiment makes recommendation's DNS lookups of `product-catalog` return random IP addresses.
    The lookups succeed, so there is no DNS error, but the connections go nowhere.
  evidence:
  - 'recommendation logs: connection failures / timeouts to odd IP addresses for product-catalog.'
  - '`nslookup product-catalog` from another pod returns the correct ClusterIP.'
  - '`kubectl get dnschaos -A`: `catalog-dns-random`.'
reference:
  commands:
  - kubectl delete dnschaos.chaos-mesh.org catalog-dns-random
notes:
- DNSChaos needs a shell in the target container; recommendation (python) has one.
