spec_version: 2
id: dns-error-005
version: 1
title: DNS lookups of one dependency fail from one service
mechanism: chaos/dns-error
split: train
seed: 1005
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Adding to cart and placing orders started failing a few minutes ago. Find the cause and fix it.
    ticket: Since the cart's database pod was rescheduled a few minutes ago, adding to cart and placing orders fail.
      The valkey-cart pod is Running and healthy. Find the cause and fix it.
tags:
  layer: network
  symptom: hard-errors
  fix_type:
  - delete-object
  drivers:
  - looks-healthy
  - partial-reachability
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest: chaos.yaml
    kill_pods_after:
    - opentelemetry.io/name=valkey-cart
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 3000
  - type: journey
    journey: checkout
    repeat: 2
    max_error_pct: 0
    max_avg_ms: 5000
  forbidden:
  - delete_namespace
  - disable_alerts
  - scale_to_zero
  - edit_verifier
ground_truth:
  root_causes:
  - component: dnschaos/dns-error-005
    namespace: default
    what: a DNSChaos experiment makes lookups of valkey-cart fail, only from the cart pod
  explanation: A Chaos Mesh DNSChaos experiment makes DNS lookups of valkey-cart fail, but only from the cart pod.
    When the valkey pod was rescheduled, cart's connection dropped and it could not resolve the name again.
  evidence:
  - adding to cart fails, and orders fail too (checkout reads the cart)
  - valkey-cart and cart are both Running
  - 'cart logs: connection errors to valkey-cart mentioning name resolution / No such host'
  - other pods resolve valkey-cart and CoreDNS is healthy, so it is not a cluster-wide DNS outage
  - kubectl get dnschaos -A shows the experiment
reference:
  commands:
  - kubectl delete dnschaos.chaos-mesh.org dns-error-005
validation:
  detect_timeout_s: 180
  recover_timeout_s: 240
notes:
- 'kill_pods_after: cart keeps a long-lived connection to valkey-cart; a routine reschedule of the valkey pod forces
  it to look the name up again.'
meta:
  golden: true
