spec_version: 2
id: prometheus-otlp-disabled-088
version: 1
title: Prometheus restarted without its OTLP receiver
mechanism: observability/metrics-ingest-disabled
family: observability
split: train
seed: 1088
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Every metrics dashboard went flat after Prometheus was restarted with 'cleaned up' flags. Find the cause
      and fix it.
tags:
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: prometheus
    recreate_pods: false
    ops:
    - op: replace
      path: /spec/template/spec/containers/$c/args
      value:
      - --storage.tsdb.retention.time=7d
      - --config.file=/etc/config/prometheus.yml
      - --storage.tsdb.path=/data
      - --web.console.libraries=/etc/prometheus/console_libraries
      - --web.console.templates=/etc/prometheus/consoles
      - --enable-feature=exemplar-storage
verifier:
  checks:
  - type: prometheus
    query: sum(rate(http_server_request_duration_seconds_count[1m]))
    min_value: 0.01
  root_cause:
  - prometheus
reference:
  commands:
  - kubectl patch deployment prometheus --type=json -p '[{"op":"add","path":"/spec/template/spec/containers/0/args/-","value":"--web.enable-otlp-receiver"}]'
  - kubectl rollout status deployment/prometheus --timeout=240s
  cause: Prometheus was restarted without `--web.enable-otlp-receiver`. The collector pushes metrics over OTLP,
    and every push is now rejected (404), so no new samples arrive.
  diagnose:
  - 'collector logs: `Exporting failed ... prometheus ... 404`.'
  - Prometheus is up, but queries for application metrics return nothing recent.
  - '`kubectl get deploy prometheus -o yaml`: the OTLP receiver flag is missing.'
validation:
  detect_timeout_s: 300
  recover_timeout_s: 360
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
