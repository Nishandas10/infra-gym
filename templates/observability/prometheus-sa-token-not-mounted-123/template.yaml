spec_version: 2
id: prometheus-sa-token-not-mounted-123
version: 1
title: A hardening change stopped mounting Prometheus's service account token; its Kubernetes scrape targets vanish
mechanism: rbac/sa-token-not-mounted
split: train
seed: 1123
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: 'Alert "container metrics absent": Prometheus has had no container CPU or memory metrics for the last few
      minutes, while the shop''s application metrics still arrive. Find the cause and fix it.'
    ticket: 'Alert "container metrics absent": Prometheus has had no container CPU or memory metrics for the last few
      minutes, while the shop''s application metrics still arrive. A pod hardening change went out shortly before.
      Find the cause and fix it.'
    hinted: 'Alert "container metrics absent": Prometheus has had no container CPU or memory metrics for the last few
      minutes, while the shop''s application metrics still arrive. Prometheus can no longer authenticate to the
      Kubernetes API. Find the cause and fix it.'
  leak_terms: [service account, serviceaccount, token, automount, rbac, certificate, credential, harden]
tags:
  layer: observability
  symptom: telemetry-only
  fix_type:
  - config-edit
  drivers:
  - looks-healthy
  injector: k8s-api
fault:
  steps:
  - mechanism: k8s.workload_patch
    target: prometheus
    ops:
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
  # The same hardening change on services that never call the Kubernetes API: harmless.
  - mechanism: k8s.workload_patch
    target: quote
    noise: true
    ops:
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
  - mechanism: k8s.workload_patch
    target: currency
    noise: true
    ops:
    - op: add
      path: /spec/template/spec/automountServiceAccountToken
      value: false
verifier:
  checks:
  - type: prometheus
    query: count(up{job="kubernetes-nodes-cadvisor"})
    min_value: 1
  - type: prometheus
    query: count(up{job="kubernetes-pods"})
    min_value: 1
ground_truth:
  root_causes:
  - component: deployment/prometheus
    namespace: default
    what: automountServiceAccountToken is false, so Prometheus has no token or CA certificate for the Kubernetes API
      and its Kubernetes service discovery and cadvisor scrape pools cannot be created
  explanation: >-
    A pod hardening change set `automountServiceAccountToken: false` on several Deployments, Prometheus among them.
    Prometheus discovers its kubernetes-pods targets and scrapes the nodes' cadvisor through the Kubernetes API with
    the pod's service account token and CA certificate. Without the mounted token those scrape pools fail ("unable
    to read CA cert"), so every container and pod-annotation metric disappears. Application metrics still arrive
    because the collector pushes them over OTLP. Prometheus itself stays Running and Ready.
  evidence:
  - '`kubectl logs deploy/prometheus`: `error creating new scrape pool ... unable to read CA cert` for the
    kubernetes-* jobs.'
  - 'Prometheus `up{job="kubernetes-nodes-cadvisor"}` and `up{job="kubernetes-pods"}` return nothing; OTLP
    application metrics are still current.'
  - '`kubectl get deploy prometheus -o yaml`: `automountServiceAccountToken: false` in the pod template; the pod has
    no /var/run/secrets/kubernetes.io/serviceaccount volume.'
  red_herrings:
  - 'quote and currency got the same `automountServiceAccountToken: false`; they never call the Kubernetes API and
    are unaffected.'
reference:
  commands:
  - kubectl patch deployment prometheus --type json -p '[{"op":"remove","path":"/spec/template/spec/automountServiceAccountToken"}]'
  - kubectl rollout status deployment/prometheus --timeout=240s
  fix: >-
    Remove `automountServiceAccountToken: false` from the Prometheus Deployment's pod template (or set it to true);
    the rollout gives the new pod its token and the Kubernetes scrape jobs come back within about a minute. quote and
    currency do not need to change.
validation:
  recover_timeout_s: 360
notes:
- 'Measured on a dev cluster, 2026-10-17: both target counts went to "no data" within 62 s of injection and stayed
  there for 7 min while Prometheus was 1/1 Running. After the reference fix the cadvisor targets were back at once and
  kubernetes-pods within 61 s; both stayed up.'
