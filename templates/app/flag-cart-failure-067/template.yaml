spec_version: 2
id: flag-cart-failure-067
version: 1
title: Cart service errors (cartFailure)
mechanism: app-flag/cart-failure
split: train
seed: 1067
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Customers report errors around their cart and when placing orders. Find the cause and fix it.
tags:
  layer: app
  symptom: hard-errors
  fix_type:
  - flag
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: cartFailure
    variant: 100%
verifier:
  checks:
  - type: journey
    journey: cart
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: flag/cartFailure
    namespace: default
    what: 'the flag is at 100%: the cart service fails its operations on purpose'
  explanation: The `cartFailure` flag (at 100%) makes the cart service fail its operations on purpose.
  evidence:
  - 'cart logs / Jaeger: cart RPC errors carrying the feature-flag attribute.'
  - Pods are healthy, and valkey-cart is healthy.
  - 'Feature Flags UI: `cartFailure` is at 100%.'
reference:
  commands:
  - python injectors/toggle_flag.py cartFailure --off
  agent_commands:
  - 'kubectl rollout restart deployment/flagd'
  - 'kubectl rollout status deployment/flagd --timeout=120s'
