spec_version: 2
id: flag-ad-failure-064
version: 1
title: Ad service fails every request (feature flag adFailure)
mechanism: app-flag/ad-failure
split: train
seed: 1064
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The ad banner is missing on some page views. Find the cause and fix it.
    ticket: The ad banner is missing on some page views, and the frontend logs occasional errors from the ad service.
      Find the cause and fix it.
tags:
  layer: app
  symptom: partial
  fix_type:
  - flag
  drivers:
  - intermittent
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: adFailure
    variant: 'on'
verifier:
  checks:
  - type: journey
    journey: ads
    repeat: 30
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: flag/adFailure
    namespace: default
    what: 'the flag is on: the ad service fails about one in ten GetAds calls on purpose'
  explanation: The `adFailure` feature flag is on, so the ad service fails about one in ten GetAds calls on purpose.
    The failure is intermittent, so small samples often look healthy.
  evidence:
  - 'ad logs: errors on some GetAds calls; frontend `/api/data` returns 500 now and then.'
  - Error rate over many requests is ~10%, not 100%.
  - Nothing restarted and nothing was deployed.
  - 'Feature Flags UI: `adFailure` is on.'
reference:
  commands:
  - python injectors/toggle_flag.py adFailure --off
  agent_commands:
  - 'kubectl rollout restart deployment/flagd'
  - 'kubectl rollout status deployment/flagd --timeout=120s'
notes:
- 'adFailure fails ~1 in 10 requests: 30 probes catch it ~96% of the time.'
