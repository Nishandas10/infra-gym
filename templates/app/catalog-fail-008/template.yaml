spec_version: 2
id: catalog-fail-008
version: 1
title: One product always fails (productCatalogFailure)
mechanism: app-flag/catalog-single-product-failure
split: train
seed: 1008
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: A customer reports that one product page (the 'National Park Foundation Explorascope') always shows an
      error, while every other product works. Find the cause and fix it.
tags:
  layer: app
  symptom: partial
  fix_type:
  - flag
  drivers:
  - partial-impact
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: productCatalogFailure
    variant: 'on'
verifier:
  checks:
  - type: http
    url: http://frontend-proxy.default.svc.cluster.local:8080/api/products/OLJCESPC7Z
    expect_status: 200
    max_ms: 3000
  - type: journey
    journey: browse
    repeat: 3
    max_error_pct: 34
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: flag/productCatalogFailure
    namespace: default
    what: the flag's targeting rule makes product-catalog fail every request for product OLJCESPC7Z
  explanation: The productCatalogFailure flag has a targeting rule that makes product-catalog fail requests for
    exactly one product, OLJCESPC7Z. Everything else works, so aggregate error rates stay low.
  evidence:
  - /api/products/OLJCESPC7Z returns 500; any other product ID returns 200
  - product-catalog logs errors mentioning that product ID and the feature flag
  - 'Jaeger: GetProduct traces with app.product.id=OLJCESPC7Z are errors'
  - productCatalogFailure is on; its targeting rule returns on for OLJCESPC7Z
reference:
  commands:
  - python injectors/toggle_flag.py productCatalogFailure --off
  agent_commands:
  - 'kubectl rollout restart deployment/flagd'
  - 'kubectl rollout status deployment/flagd --timeout=120s'
validation:
  detect_timeout_s: 120
  recover_timeout_s: 120
meta:
  golden: true
