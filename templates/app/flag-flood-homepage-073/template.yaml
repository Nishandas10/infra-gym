spec_version: 2
id: flag-flood-homepage-073
version: 1
title: Synthetic traffic flood against the homepage (loadGeneratorFloodHomepage)
mechanism: app-flag/traffic-flood
split: train
seed: 1073
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Homepage traffic jumped far above normal and the frontend's CPU went with it, yet there were no releases
      or marketing campaigns. Find the source and stop it.
tags:
  layer: app
  symptom: resource
  fix_type:
  - flag
  drivers:
  - misattributed-symptom
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: loadGeneratorFloodHomepage
    variant: 'on'
verifier:
  checks:
  - type: traffic
    match: ^/$
    window_s: 30
    max_error_pct: 100
    max_avg_ms: 100000
    min_requests: 0
    max_rps: 2.0
ground_truth:
  root_causes:
  - component: flag/loadGeneratorFloodHomepage
    namespace: default
    what: 'the flag is on: the shop''s own load generator floods the homepage'
  explanation: The `loadGeneratorFloodHomepage` flag makes the load generator send 100 homepage requests per task,
    an internal traffic flood that looks like an attack.
  evidence:
  - 'frontend-proxy access logs / Locust stats: homepage request rate far above normal, all from the load generator.'
  - 'Feature Flags UI: `loadGeneratorFloodHomepage` is on.'
reference:
  commands:
  - python injectors/toggle_flag.py loadGeneratorFloodHomepage --off
validation:
  detect_timeout_s: 180
