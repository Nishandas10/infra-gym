spec_version: 2
id: flag-ad-manual-gc-066
version: 1
title: Ad service triggers full garbage collections (adManualGc)
mechanism: app-flag/ad-full-gc
split: train
seed: 1066
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Ad requests show long, irregular latency spikes. Find the cause and fix it.
tags:
  layer: app
  symptom: latency
  fix_type:
  - flag
  - restart
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: adManualGc
    variant: 'on'
  restart_on_revert:
  - deployment/ad
verifier:
  checks:
  - type: journey
    journey: ads
    repeat: 4
    max_error_pct: 0
    max_avg_ms: 700
ground_truth:
  root_causes:
  - component: flag/adManualGc
    namespace: default
    what: 'the flag is on: the ad service forces full garbage collections (long stop-the-world pauses); the JVM
      needs a restart after the flag is off'
  explanation: The `adManualGc` flag makes the ad service fill its heap with throwaway objects and force full `System.gc()`
    runs, causing long stop-the-world pauses. The JVM can stay stuck in garbage collection after the flag is turned
    off, so the service also needs a restart.
  evidence:
  - 'Jaeger: GetAds spans have long gaps inside the service.'
  - 'JVM metrics (Grafana): GC pause time spikes; heap usage pinned near its maximum.'
  - 'ad logs: `Triggering a manual garbage collection` / `The artificially triggered GCs took ... ms`.'
  - 'Feature Flags UI: `adManualGc` is on.'
reference:
  commands:
  - python injectors/toggle_flag.py adManualGc --off
  - kubectl rollout restart deployment/ad
  - kubectl rollout status deployment/ad --timeout=300s
validation:
  detect_timeout_s: 300
notes:
- 'The JVM can stay wedged after the flag is off (run 5: ads still timing out 5 min later), so both the fix and
  the revert restart it.'
