spec_version: 2
id: flag-email-memory-leak-068
version: 1
title: Email service leaks memory until it is OOMKilled (emailMemoryLeak)
mechanism: app-flag/email-memory-leak
split: train
seed: 1068
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: The email service restarts every few minutes and some confirmations are lost. Find the cause and fix it.
tags:
  layer: app
  symptom: partial
  fix_type:
  - flag
  - restart
  drivers:
  - slow-burn
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: emailMemoryLeak
    variant: 10000x
verifier:
  checks:
  - type: pods_stable
    selector: opentelemetry.io/name=email
    min_age_s: 300
  - type: journey
    journey: email
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: flag/emailMemoryLeak
    namespace: default
    what: 'the flag is on: the email service keeps a growing copy of data per email until it is OOMKilled'
  explanation: The `emailMemoryLeak` flag makes the email service keep a growing copy of data for every email, so
    its memory climbs until it is OOMKilled at its 100Mi limit, over and over.
  evidence:
  - '`kubectl describe pod -l opentelemetry.io/name=email`: `Last State: OOMKilled`, restart count rising.'
  - 'Memory graph: sawtooth.'
  - 'Feature Flags UI: `emailMemoryLeak` is on. Turn it off, then restart to drop the leaked memory.'
reference:
  commands:
  - python injectors/toggle_flag.py emailMemoryLeak --off
  - kubectl rollout restart deployment/email
  - kubectl rollout status deployment/email --timeout=300s
  agent_commands:
  - 'kubectl rollout restart deployment/flagd'
  - 'kubectl rollout status deployment/flagd --timeout=120s'
validation:
  detect_timeout_s: 900
  recover_timeout_s: 600
  hold_s: 45
  poll_s: 15
  baseline_timeout_s: 400
