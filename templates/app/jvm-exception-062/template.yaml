spec_version: 2
id: jvm-exception-062
version: 1
title: Exception injected into a JVM method at runtime
mechanism: chaos/jvm-method-exception
split: train
seed: 1062
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: The ad banner has disappeared from the shop. Nothing was deployed today. Find the cause and fix it.
    ticket: The ad banner is gone and the ad service logs mention an inventory error, although no one deployed anything.
      Find the cause and fix it.
tags:
  layer: app
  symptom: hard-errors
  fix_type:
  - delete-object
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: JVMChaos
      metadata:
        name: ad-getads-exception
        namespace: default
      spec:
        action: exception
        mode: all
        class: oteldemo.AdService$AdServiceImpl
        method: getAds
        exception: java.lang.RuntimeException("ad inventory unavailable")
        port: 9277
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: ad
verifier:
  checks:
  - type: journey
    journey: ads
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
ground_truth:
  root_causes:
  - component: jvmchaos/ad-getads-exception
    namespace: default
    what: a JVMChaos experiment makes AdServiceImpl.getAds throw at runtime
  explanation: A Chaos Mesh JVMChaos experiment attached a Byteman agent to the running ad JVM and makes `AdServiceImpl.getAds`
    throw `RuntimeException("ad inventory unavailable")`. The code on disk is unchanged.
  evidence:
  - 'ad logs: `RuntimeException: ad inventory unavailable` from getAds.'
  - 'No new deploy: `kubectl rollout history deployment/ad`.'
  - '`kubectl get jvmchaos -A`: `ad-getads-exception`.'
reference:
  commands:
  - kubectl delete jvmchaos.chaos-mesh.org ad-getads-exception
notes:
- Byteman can only throw checked exceptions a method declares; getAds declares none.
