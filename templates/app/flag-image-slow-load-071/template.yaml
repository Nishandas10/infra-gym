spec_version: 2
id: flag-image-slow-load-071
version: 2
title: Images served with an artificial delay (imageSlowLoad)
mechanism: app-flag/image-slow-load
split: train
seed: 1071
world: k8s-shop
bench_eligible: true
task:
  kind: incident
  prompts:
    page: Product images take about 10 seconds to appear. Find the cause and fix it.
tags:
  layer: app
  symptom: latency
  fix_type:
  - flag
  drivers:
  - misattributed-symptom
  injector: flagd
fault:
  steps:
  - mechanism: app.flag
    flag: imageSlowLoad
    variant: 10sec
verifier:
  checks:
  - type: journey
    journey: images_browser
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 3000
    timeout_s: 15
ground_truth:
  root_causes:
  - component: flag/imageSlowLoad
    namespace: default
    what: 'the flag is on: the browser code adds an Envoy fault-delay header, so the edge proxy holds every image
      request for 10 seconds'
  explanation: 'The `imageSlowLoad` flag is read by the shop''s browser code, which then sends every image request
    with `x-envoy-fault-delay-request: 10000`. The Envoy edge proxy honours that header and holds each image for
    10 seconds. The image server itself is fast.'
  evidence:
  - Only image requests are slow for customers; the rest of each page is fast.
  - 'An image fetched through frontend-proxy with curl is fast: the delay applies only to requests that carry the header
    the browser code adds. image-provider answers in milliseconds.'
  - 'flagd''s live flag file (`/app/data/demo.flagd.json`, flagd pod, container flagd-ui) or the Feature Flags UI:
    `imageSlowLoad` is at 10sec. The change is live only: restarting flagd reloads the default (off) from its ConfigMap.'
  - 'frontend-proxy writes no access log in this world, so the slow requests do not show in its logs.'
reference:
  commands:
  - python injectors/toggle_flag.py imageSlowLoad --off
  agent_commands:
  - 'kubectl rollout restart deployment/flagd'
  - 'kubectl rollout status deployment/flagd --timeout=120s'
notes:
- 'v2 (2026-10-19): the evidence no longer claims the frontend-proxy logs show the delayed image requests. Checked live
  on a spare cluster: under the fault the probe''s browser journey took 10 s per image, and frontend-proxy logged no request
  line at all (its log holds only Envoy start-up messages). The flag definition is the observable evidence.'
