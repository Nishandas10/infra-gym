spec_version: 2
id: pod-kill-003
version: 1
title: A service's pod is killed every 45 seconds
mechanism: chaos/pod-kill-periodic
family: chaos
split: train
seed: 1003
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: 'Checkout fails intermittently: some orders go through, others error out, and a retry usually works. Find
      out why and fix it.'
tags:
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest: chaos.yaml
verifier:
  checks:
  - type: pods_stable
    selector: opentelemetry.io/name=checkout
    min_age_s: 90
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 5000
  root_cause:
  - checkout
  forbidden:
  - delete_namespace
  - disable_alerts
  - scale_to_zero
  - edit_verifier
reference:
  commands:
  - kubectl delete schedule.chaos-mesh.org pod-kill-003
validation:
  detect_timeout_s: 150
  recover_timeout_s: 240
  hold_s: 45
meta:
  golden: true
