spec_version: 2
id: net-packet-loss-052
version: 1
title: Heavy packet loss on a service's network interface
mechanism: chaos/network-packet-loss
family: chaos
split: train
seed: 1052
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Product pages load slowly and sometimes fail; retries sometimes help. Find the cause and fix it.
tags:
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: NetworkChaos
      metadata:
        name: catalog-packet-loss
        namespace: default
      spec:
        action: loss
        mode: all
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: product-catalog
        loss:
          loss: '60'
          correlation: '0'
        direction: to
verifier:
  checks:
  - type: journey
    journey: browse
    repeat: 4
    max_error_pct: 0
    max_avg_ms: 1500
  - type: journey
    journey: catalog
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 1500
  root_cause:
  - product-catalog
reference:
  commands:
  - kubectl delete networkchaos.chaos-mesh.org catalog-packet-loss
  cause: A Chaos Mesh NetworkChaos experiment drops 60% of packets leaving the product-catalog pod. TCP retransmits
    turn that into multi-second latency and occasional timeouts.
  diagnose:
  - 'Jaeger: time spent waiting on product-catalog calls, not inside them.'
  - '`kubectl get pods`: nothing is crashing.'
  - '`kubectl get networkchaos -A`: `catalog-packet-loss`.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
