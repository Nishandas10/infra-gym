spec_version: 2
id: pod-failure-055
version: 1
title: Pod stays 'Running' but its process has been replaced by a pause container
mechanism: chaos/pod-failure
family: chaos
split: train
seed: 1055
world: k8s-shop
bench_eligible: false
task:
  kind: incident
  prompts:
    page: Orders fail at shipping. `kubectl get pods` claims shipping is Running. Find the cause and fix it.
tags:
  injector: chaos-mesh
fault:
  steps:
  - mechanism: chaos.mesh
    manifest:
    - apiVersion: chaos-mesh.org/v1alpha1
      kind: PodChaos
      metadata:
        name: shipping-pod-failure
        namespace: default
      spec:
        action: pod-failure
        mode: all
        selector:
          namespaces:
          - default
          labelSelectors:
            opentelemetry.io/name: shipping
verifier:
  checks:
  - type: journey
    journey: checkout
    repeat: 3
    max_error_pct: 0
    max_avg_ms: 2500
  root_cause:
  - shipping
reference:
  commands:
  - kubectl delete podchaos.chaos-mesh.org shipping-pod-failure
  cause: A PodChaos `pod-failure` experiment swapped the shipping container's image for a `pause` image, so the
    pod exists and looks alive but nothing is serving.
  diagnose:
  - '`kubectl get pods`: shipping Running, but connections to it fail.'
  - '`kubectl get pod -l opentelemetry.io/name=shipping -o jsonpath=''{.items[0].spec.containers[0].image}''`: a
    pause image, not the shipping image.'
  - '`kubectl get podchaos -A`: `shipping-pod-failure`.'
validation:
  detect_timeout_s: 240
  recover_timeout_s: 300
  hold_s: 30
  poll_s: 10
  baseline_timeout_s: 120
